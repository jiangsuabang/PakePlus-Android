<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>末日幸存者 - Zombie Survivor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Microsoft YaHei', sans-serif;
}
canvas {
  display: block;
  background: #1a1a2e;
  touch-action: none;
}
#ui-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
#level-up-screen {
  display: none;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.85);
  border: 2px solid #e74c3c;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
  color: #fff;
  pointer-events: auto;
  z-index: 10;
  width: min(90vw, 400px);
  max-height: 80vh;
  overflow-y: auto;
}
#level-up-screen h2 {
  color: #e74c3c;
  font-size: clamp(16px, 4vw, 28px);
  margin-bottom: 10px;
}
#level-up-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.level-up-btn {
  background: #2c1810;
  border: 1px solid #e74c3c;
  color: #fff;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: clamp(11px, 2.5vw, 16px);
  text-align: left;
  transition: all 0.2s;
}
.level-up-btn:hover {
  background: #e74c3c;
  transform: scale(1.03);
}
.level-up-btn .skill-name {
  font-weight: bold;
  font-size: clamp(12px, 3vw, 18px);
}
.level-up-btn .skill-desc {
  color: #aaa;
  font-size: clamp(9px, 2vw, 13px);
  margin-top: 2px;
}
.level-up-btn.epic-btn {
  border-color: #9b59b6;
}
.level-up-btn.epic-btn:hover {
  background: #9b59b6;
}
#game-over-screen {
  display: none;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.9);
  border: 2px solid #666;
  border-radius: 12px;
  padding: clamp(20px, 4vw, 40px);
  text-align: center;
  color: #fff;
  pointer-events: auto;
  z-index: 10;
  width: min(90vw, 400px);
}
#game-over-screen h2 {
  color: #e74c3c;
  font-size: clamp(24px, 6vw, 36px);
  margin-bottom: 15px;
}
#game-over-screen p {
  color: #ccc;
  font-size: clamp(12px, 3vw, 16px);
  margin: 8px 0;
}
.go-buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
  justify-content: center;
  margin-top: 20px;
}
#restart-btn, #btn-back-to-menu {
  padding: clamp(10px, 2vw, 14px) clamp(20px, 4vw, 30px);
  border: none;
  color: #fff;
  border-radius: 8px;
  cursor: pointer;
  font-size: clamp(12px, 3vw, 16px);
  transition: all 0.2s;
}
#restart-btn {
  background: #e74c3c;
}
#btn-back-to-menu {
  background: #555;
}
#restart-btn:hover {
  background: #c0392b;
  transform: scale(1.05);
}
#btn-back-to-menu:hover {
  background: #444;
  transform: scale(1.05);
}
/* Main Menu */
#main-menu {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: #fff;
  z-index: 10;
  pointer-events: auto;
}
#main-menu h1 {
  font-size: clamp(32px, 8vw, 56px);
  color: #e74c3c;
  text-shadow: 0 0 30px rgba(231,76,60,0.6);
  margin-bottom: 8px;
}
#main-menu .subtitle {
  color: #888;
  font-size: clamp(12px, 3vw, 16px);
  margin-bottom: 20px;
}
.class-card {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(85vw, 400px);
  margin: 8px auto;
  padding: 14px 18px;
  border: 2px solid #444;
  border-radius: 10px;
  background: rgba(26,26,46,0.8);
  color: #ccc;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
}
.class-card:hover { border-color: #888; }
.class-card.selected { border-color: #e74c3c; color: #fff; background: rgba(231,76,60,0.15); }
.class-card .class-icon { font-size: clamp(20px, 5vw, 28px); }
.class-card .class-info { flex: 1; }
.class-card .class-name { font-size: clamp(14px, 3.5vw, 18px); font-weight: bold; }
.class-card .class-desc { font-size: clamp(10px, 2.5vw, 12px); color: #888; margin-top: 2px; }
.class-card.selected .class-desc { color: #bbb; }
.mode-btn {
  display: block;
  width: min(80vw, 260px);
  margin: 12px auto;
  padding: clamp(10px, 2vw, 20px);
  border: 2px solid #e74c3c;
  border-radius: 10px;
  background: rgba(44,24,16,0.8);
  color: #fff;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.mode-btn:hover {
  background: #e74c3c;
  transform: scale(1.05);
}
.mode-btn .mode-title {
  font-size: clamp(14px, 3.5vw, 22px);
  font-weight: bold;
  margin-bottom: 6px;
}
.mode-btn .mode-desc {
  font-size: clamp(10px, 2.5vw, 14px);
  color: #aaa;
}
.mode-btn:hover .mode-desc { color: #eee; }
/* Lobby Screen */
#lobby-screen {
  display: none;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.9);
  border: 2px solid #e74c3c;
  border-radius: 12px;
  padding: clamp(15px, 3vw, 30px);
  color: #fff;
  pointer-events: auto;
  z-index: 10;
  width: min(90vw, 600px);
}
#lobby-screen h2 {
  color: #e74c3c;
  font-size: clamp(18px, 4vw, 26px);
  margin-bottom: 20px;
  text-align: center;
}
.lobby-section {
  margin-bottom: 20px;
}
.lobby-section h3 {
  color: #ccc;
  font-size: clamp(12px, 2.5vw, 16px);
  margin-bottom: 10px;
  border-bottom: 1px solid #333;
  padding-bottom: 5px;
}
.lobby-input {
  width: 100%;
  padding: 10px;
  background: #1a1a2e;
  border: 1px solid #555;
  border-radius: 6px;
  color: #fff;
  font-size: clamp(11px, 2.5vw, 14px);
  margin-bottom: 10px;
}
.lobby-btn {
  padding: 10px 20px;
  border: 1px solid #e74c3c;
  border-radius: 6px;
  background: #2c1810;
  color: #fff;
  cursor: pointer;
  font-size: clamp(11px, 2.5vw, 14px);
  transition: all 0.2s;
  margin: 4px;
}
.lobby-btn:hover {
  background: #e74c3c;
}
.lobby-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
#room-list {
  max-height: 200px;
  overflow-y: auto;
  margin-bottom: 10px;
}
.room-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  margin: 4px 0;
  background: #1a1a2e;
  border: 1px solid #333;
  border-radius: 6px;
}
.room-item:hover {
  border-color: #e74c3c;
}
.room-info { text-align: left; }
.room-name { font-weight: bold; font-size: 15px; }
.room-detail { font-size: 12px; color: #888; }
.room-join-btn {
  padding: 6px 16px;
  background: #27ae60;
  border: none;
  border-radius: 4px;
  color: #fff;
  cursor: pointer;
  font-size: 13px;
}
.room-join-btn:hover { background: #2ecc71; }
.room-join-btn:disabled { opacity: 0.4; cursor: not-allowed; }
#lobby-player-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0;
}
.lobby-player-tag {
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: bold;
}
#lobby-status {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  margin: 10px 0;
  min-height: 18px;
}
.lobby-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 15px;
}
/* Multiplayer HUD */
#mp-scoreboard {
  position: absolute;
  top: 80px;
  right: 20px;
  background: rgba(0,0,0,0.6);
  border: 1px solid #444;
  border-radius: 6px;
  padding: 8px 12px;
  color: #fff;
  font-size: 12px;
  z-index: 5;
  pointer-events: none;
  display: none;
}
#mp-scoreboard h4 {
  font-size: 13px;
  margin-bottom: 6px;
  color: #e74c3c;
}
.sb-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 2px 0;
}
.sb-name { font-weight: bold; }
.sb-dead { color: #666; text-decoration: line-through; }
/* Auto Aim Toggle */
#auto-aim-toggle {
  position: absolute;
  bottom: 150px;
  right: 20px;
  left: auto;
  transform: none;
  z-index: 8;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,0,0,0.6);
  border: 1px solid #555;
  border-radius: 6px;
  padding: clamp(3px, 0.5vw, 6px) clamp(6px, 1vw, 12px);
  color: #fff;
  font-size: clamp(9px, 2vw, 13px);
  pointer-events: auto;
}
#auto-aim-toggle input {
  cursor: pointer;
}
/* Lobby section hiding */
.lobby-hidden { display: none !important; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- Main Menu -->
<div id="main-menu">
  <h1>☠ 末日幸存者</h1>
  <div class="subtitle">在丧尸潮中尽可能久地活下去</div>
  <div id="class-cards">
    <div class="class-card selected" data-class="gunner" onclick="selectClass('gunner')">
      <div class="class-icon">🔫</div>
      <div class="class-info">
        <div class="class-name">枪战士</div>
        <div class="class-desc">精通枪械的战斗专家，弹幕覆盖，火力压制</div>
      </div>
    </div>
    <div class="class-card" data-class="mechanist" onclick="selectClass('mechanist')">
      <div class="class-icon">⚙️</div>
      <div class="class-info">
        <div class="class-name">机甲师</div>
        <div class="class-desc">召唤机械军团，远程近战协同作战</div>
      </div>
    </div>
    <div class="class-card" data-class="scientist" onclick="selectClass('scientist')">
      <div class="class-icon">🔬</div>
      <div class="class-info">
        <div class="class-name">科学家</div>
        <div class="class-desc">操控化学与能量的疯狂天才，DEBUFF叠加致死</div>
      </div>
    </div>
  </div>
  <button class="mode-btn" id="btn-single">
    <div class="mode-title">🎮 单机模式</div>
    <div class="mode-desc">独自面对丧尸潮，存活30分钟</div>
  </button>
  <button class="mode-btn" id="btn-multi">
    <div class="mode-title">🌐 联机模式</div>
    <div class="mode-desc">创建/加入房间，2-4人联机对战</div>
  </button>
  <button class="mode-btn" id="btn-credits" style="background:rgba(255,255,255,0.03);border-color:rgba(255,255,255,0.1);">
    <div class="mode-title">👤 关于作者</div>
    <div class="mode-desc">Zombie Survivor 幕后制作</div>
  </button>
  <div id="credits-screen" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#050508;z-index:9999;overflow:hidden;">
    <div id="credits-container" style="position:absolute;top:100%;left:0;width:100%;padding:40px 20%;box-sizing:border-box;text-align:center;">
      <div style="font-family:'Impact','Arial Black',sans-serif;font-size:48px;color:#cc0000;letter-spacing:8px;margin-bottom:60px;text-shadow:0 0 20px rgba(200,0,0,0.6);">ZOMBIE SURVIVOR</div>
      <div style="font-family:'Courier New',monospace;font-size:22px;color:#888;margin-bottom:50px;letter-spacing:4px;">A SOLO INDIE GAME</div>
    </div>
    <button id="btn-credits-back" style="position:fixed;top:20px;left:20px;z-index:10000;padding:8px 20px;background:rgba(0,0,0,0.7);color:#aaa;border:1px solid #444;border-radius:4px;font-size:14px;cursor:pointer;font-family:'Courier New',monospace;">&lt; 返回</button>
  </div>
  <div style="color:#666; font-size:12px; margin-top:20px;">
    WASD/方向键移动 · 攻击自动 · 每2分钟一波Boss · 无限轮次
  </div>
</div>

<!-- Lobby Screen -->
<div id="lobby-screen">
  <h2>🌐 联机大厅</h2>
  <div class="lobby-section" id="lobby-create-section">
    <h3>创建房间</h3>
    <input type="text" class="lobby-input" id="create-room-name" placeholder="房间名称" maxlength="20" value="幸存者集结">
    <input type="text" class="lobby-input" id="create-player-name" placeholder="你的昵称" maxlength="12" value="玩家1">
    <button class="lobby-btn" id="btn-create-room" style="width:100%;">📋 创建房间</button>
  </div>
  <div class="lobby-section" id="lobby-scan-section">
    <h3>扫描房间</h3>
    <button class="lobby-btn" id="btn-scan-rooms" style="width:100%;">🔍 扫描当前可用房间</button>
    <div id="room-list"></div>
  </div>
  <div class="lobby-section" id="room-detail-section" style="display:none;">
    <h3>房间详情</h3>
    <div id="lobby-player-list"></div>
    <div id="lobby-status"></div>
    <div class="lobby-actions">
      <button class="lobby-btn" id="btn-leave-room">离开房间</button>
      <button class="lobby-btn" id="btn-start-multi" style="background:#27ae60;">开始游戏</button>
    </div>
    <div style="margin-top:10px; padding:8px; background:rgba(255,165,0,0.15); border-radius:8px; color:#ffa500; font-size:12px; text-align:center;">
      联机模式正在优化中，目前各玩家独立刷怪
    </div>
  </div>
  <div style="text-align:center; margin-top:15px;">
    <button class="lobby-btn" id="btn-back-menu">← 返回主菜单</button>
  </div>
</div>

<!-- Multiplayer Scoreboard -->
<div id="mp-scoreboard"></div>

<!-- Mute Button -->
<button id="btn-mute" onclick="AudioSys.toggleMute(); this.textContent = AudioSys.muted ? '🔇' : '🔊';" style="position:fixed;bottom:10px;right:10px;z-index:999;padding:4px 10px;background:rgba(0,0,0,0.6);color:#fff;border:1px solid #555;border-radius:4px;font-size:14px;cursor:pointer;">🔊</button>

<!-- Auto Aim Toggle -->
<div id="auto-aim-toggle" style="display:none;">
  <input type="checkbox" id="auto-aim-checkbox" checked>
  <label for="auto-aim-checkbox">自动瞄准</label>
</div>

<div id="level-up-screen">
  <h2>⬆ 升级！选择一项强化</h2>
  <div id="level-up-options"></div>
</div>

<div id="game-over-screen">
  <h2>你已阵亡</h2>
  <p id="go-time"></p>
  <p id="go-level"></p>
  <p id="go-kills"></p>
  <p id="go-wave"></p>
  <div class="go-buttons">
    <button id="restart-btn">再来一次</button>
    <button id="btn-back-to-menu" style="margin-top:10px; background:#555;">返回主菜单</button>
  </div>
</div>

<script>
// ============================================================
// 末日幸存者 - Zombie Survivor (Vampire Survivors Style)
// With Class System, Wave Boss, Summon Weapons, Debuff System
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// 全局UI缩放因子
let uiScale = 1;

// --- Canvas Sizing ---
function resizeCanvas() {
  const maxW = window.innerWidth;
  const maxH = window.innerHeight;
  // 强制横屏比例（竖屏时交换宽高）
  if (maxW < maxH) {
    canvas.width = maxH;
    canvas.height = maxW;
  } else {
    canvas.width = maxW;
    canvas.height = maxH;
  }
  // UI自适应缩放
  const scale = Math.min(canvas.width / 1280, canvas.height / 720);
  // 全局UI缩放因子
  uiScale = Math.min(canvas.width / 1280, canvas.height / 720);
  const uiRoot = document.getElementById('game');
  uiRoot.style.fontSize = Math.max(10, 14 * scale) + 'px';
  // 缩放HUD元素
  const hudElements = uiRoot.querySelectorAll('#hp-bar, #xp-bar, #level-display, #weapon-list, #minimap-container, #auto-aim-toggle, #kill-counter, #wave-timer');
  hudElements.forEach(el => {
    if (el) el.style.transform = scale < 0.8 ? `scale(${1/scale * 0.8})` : '';
  });
  // 动态调整摇杆大小（joystick在后面定义，首次调用时可能不可用）
  try { 
    const jScale = Math.max(0.6, uiScale);
    joystick.baseRadius = 60 * jScale;
    joystick.thumbRadius = 25 * jScale;
    aimJoystick.baseRadius = 60 * jScale;
  } catch(e) {}
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
document.addEventListener('fullscreenchange', () => {
  setTimeout(resizeCanvas, 100);
});

// --- Audio Resume on First Interaction ---
document.addEventListener('click', () => { if (AudioSys.ctx) AudioSys.resume(); }, { once: true });
document.addEventListener('touchstart', () => { if (AudioSys.ctx) AudioSys.resume(); }, { once: true });


// --- Constants ---
const WORLD_W = 4000;
const WORLD_H = 4000;
const GAME_DURATION = 30 * 60; // 30 minutes in seconds
const WAVE_INTERVAL = 120;  // 2分钟固定间隔
const MAX_WEAPON_LEVEL = 8;     // All weapons max at level 8
const XP_GEM_DROP_RATE = 0.003; // 0.3% chance for special XP magnet gem

// --- Color Palette ---
const COLORS = {
  bg: '#1a1a2e',
  ground: '#16213e',
  grid: '#1a2744',
  player: '#3498db',
  playerOutline: '#2980b9',
  zombie: ['#2ecc71', '#27ae60', '#1e8449', '#196f3d', '#145a32'],
  zombieFast: '#f39c12',
  zombieTank: '#8e44ad',
  zombieBoss: '#e74c3c',
  bullet: '#f1c40f',
  bulletGlow: 'rgba(241,196,15,0.3)',
  gem: ['#3498db', '#2ecc71', '#e74c3c', '#f39c12', '#9b59b6', '#1abc9c'],
  hp: '#e74c3c',
  hpBg: '#4a1a1a',
  xp: '#3498db',
  xpBg: '#1a2a4a',
  damage: '#e74c3c',
  heal: '#2ecc71',
};

// ============================================================
// CLASS SYSTEM
// ============================================================
const CLASS_DEFS = {
  gunner: {
    name: '枪战士',
    icon: '🔫',
    startWeapons: ['pistol', 'smg'],
    availableWeapons: ['pistol', 'smg', 'shotgun', 'split_gun', 'shock_gun', 'flamethrower'],
    desc: '精通枪械的战斗专家，弹幕覆盖，火力压制',
    ultimateWeapon: { defId: 'gatling_storm', name: '加特林风暴', desc: '全方位子弹风暴', type: 'projectile', damage: 20, cooldown: 0.08, speed: 600, range: 400, pierce: 0, projCount: 8, spread: 0.5 },
  },
  mechanist: {
    name: '机甲师',
    icon: '⚙️',
    startWeapons: ['mech_warrior', 'drone'],
    availableWeapons: ['pistol', 'drone', 'disc_blade', 'auto_turret', 'mech_warrior'],
    summonTypes: ['drone', 'disc_blade', 'auto_turret', 'mech_warrior'],
    desc: '召唤机械军团，远程近战协同作战',
    ultimateWeapon: { defId: 'mech_god', name: '机神', desc: '召唤物数量翻倍，攻速x1.5', type: 'active_buff', duration: 999999 },
  },
  scientist: {
    name: '科学家',
    icon: '🔬',
    startWeapons: ['freeze_gun', 'radiation_aura'],
    availableWeapons: ['freeze_gun', 'radiation_aura', 'poison_shot', 'burn_aura', 'em_field', 'toxic_diffuser'],
    desc: '操控化学与能量的疯狂天才，DEBUFF叠加致死',
    ultimateWeapon: { defId: 'antimatter_bomb', name: '反物质炸弹', desc: '周期性释放毁灭性范围伤害', type: 'aura', damage: 50, range: 200, debuffType: 'radiation' },
  },
};

let selectedClass = 'gunner';

function selectClass(cls) {
  selectedClass = cls;
  document.querySelectorAll('.class-card').forEach(card => {
    card.classList.toggle('selected', card.dataset.class === cls);
  });
}

// ============================================================
// GAME STATE
// ============================================================
let gameRunning = false;
let gamePaused = false;
let gameTime = 0;
let killCount = 0;
let camera = { x: 0, y: 0 };

// --- Input ---
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; keys[e.code] = false; });

// ============================================================
// VIRTUAL JOYSTICK (Touch Support)
// ============================================================
const joystick = {
  active: false,

// ========== AUDIO SYSTEM ==========
const AudioSys = {
  ctx: null,
  bgmGain: null,
  sfxGain: null,
  muted: false,
  
  init() {
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.bgmGain = this.ctx.createGain();
      this.bgmGain.gain.value = 0.15;
      this.bgmGain.connect(this.ctx.destination);
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 0.3;
      this.sfxGain.connect(this.ctx.destination);
    } catch(e) { console.warn('Audio not available:', e); }
  },
  
  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  
  // Play a simple tone as sound effect
  playSfx(freq, duration, type='square', volume=0.3) {
    if (!this.ctx || this.muted) return;
    this.resume();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(this.sfxGain);
    osc.start();
    osc.stop(this.ctx.currentTime + duration);
  },
  
  // Pre-defined sound effects
  shoot()     { this.playSfx(800, 0.08, 'square', 0.15); },
  shotgun()   { this.playSfx(200, 0.15, 'sawtooth', 0.2); },
  hit()       { this.playSfx(300, 0.06, 'triangle', 0.1); },
  kill()      { this.playSfx(600, 0.1, 'square', 0.15); this.playSfx(900, 0.15, 'sine', 0.1); },
  hurt()      { this.playSfx(150, 0.2, 'sawtooth', 0.2); },
  levelup()   { this.playSfx(523, 0.1, 'sine', 0.2); setTimeout(() => this.playSfx(659, 0.1, 'sine', 0.2), 100); setTimeout(() => this.playSfx(784, 0.2, 'sine', 0.2), 200); },
  pickup()    { this.playSfx(1200, 0.05, 'sine', 0.1); },
  explosion() { this.playSfx(80, 0.3, 'sawtooth', 0.25); this.playSfx(60, 0.4, 'square', 0.15); },
  bossAppear(){ this.playSfx(100, 0.5, 'sawtooth', 0.3); setTimeout(() => this.playSfx(150, 0.4, 'sawtooth', 0.25), 300); },
  flamethrower(){ this.playSfx(100, 0.05, 'sawtooth', 0.05); },
  
  // Background music - use MP3 file
  bgmPlaying: false,
  _bgmAudio: null,
  
  startBgm() {
    if (this.bgmPlaying) return;
    this.bgmPlaying = true;
    if (!this._bgmAudio) {
      this._bgmAudio = new Audio('BGM.mp3');
      this._bgmAudio.loop = true;
      this._bgmAudio.volume = this.muted ? 0 : 0.5;
      this._bgmAudio.addEventListener('error', () => { this._bgmFailed = true; });
    }
    if (this._bgmFailed) return;
    const play = () => { this._bgmAudio.play().catch(() => {}); };
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().then(play);
    } else {
      play();
    }
  },
  
  stopBgm() {
    this.bgmPlaying = false;
    if (this._bgmAudio) { this._bgmAudio.pause(); }
  },
  
  toggleMute() {
    this.muted = !this.muted;
    if (this.bgmGain) this.bgmGain.gain.value = this.muted ? 0 : 0.15;
    if (this.sfxGain) this.sfxGain.gain.value = this.muted ? 0 : 0.3;
    if (this._bgmAudio) this._bgmAudio.volume = this.muted ? 0 : 0.5;
    return this.muted;
  }
};

let mouseAimDir = 0;
let aimDir = 0; // 当前瞄准方向（全局）
let gunTipX = 0, gunTipY = 0; // 枪口位置

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    const x = touch.clientX;
    const y = touch.clientY;
    if (x < window.innerWidth / 2) {
      // Left side = movement joystick
      if (!joystick.active) {
        joystick.active = true;
        joystick.visible = true;
        joystick.identifier = touch.identifier;
        joystick.baseX = x;
        joystick.baseY = y;
        joystick.thumbX = x;
        joystick.thumbY = y;
      }
    } else {
      // Right side = aim joystick
      if (!aimJoystick.active) {
        aimJoystick.active = true;
        aimJoystick.identifier = touch.identifier;
        aimJoystick.startX = x;
        aimJoystick.startY = y;
        aimJoystick.currentX = x;
        aimJoystick.currentY = y;
      }
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    const x = touch.clientX;
    const y = touch.clientY;
    if (joystick.active && touch.identifier === joystick.identifier) {
      joystick.thumbX = x;
      joystick.thumbY = y;
      let dx = joystick.thumbX - joystick.baseX;
      let dy = joystick.thumbY - joystick.baseY;
      const maxDist = joystick.baseRadius;
      const d = Math.hypot(dx, dy);
      if (d > maxDist) {
        dx = (dx / d) * maxDist;
        dy = (dy / d) * maxDist;
      }
      joystick.thumbX = joystick.baseX + dx;
      joystick.thumbY = joystick.baseY + dy;
      joystick.inputX = dx / maxDist;
      joystick.inputY = dy / maxDist;
    }
    if (aimJoystick.active && touch.identifier === aimJoystick.identifier) {
      aimJoystick.currentX = x;
      aimJoystick.currentY = y;
      const dx = aimJoystick.currentX - aimJoystick.startX;
      const dy = aimJoystick.currentY - aimJoystick.startY;
      const dist = Math.hypot(dx, dy);
      const maxDist = aimJoystick.baseRadius;
      const scale = dist > maxDist ? maxDist / dist : 1;
      aimJoystick.inputX = (dx * scale) / maxDist;
      aimJoystick.inputY = (dy * scale) / maxDist;
      // Update aim direction
      if (!autoAim) {
        mouseAimDir = Math.atan2(aimJoystick.inputY, aimJoystick.inputX);
      }
      aimDir = mouseAimDir;
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (joystick.active && touch.identifier === joystick.identifier) {
      joystick.active = false;
      joystick.visible = false;
      joystick.identifier = null;
      joystick.inputX = 0;
      joystick.inputY = 0;
    }
    if (aimJoystick.active && touch.identifier === aimJoystick.identifier) {
      aimJoystick.active = false;
      aimJoystick.identifier = null;
      aimJoystick.inputX = 0;
      aimJoystick.inputY = 0;
    }
  }
}, { passive: false });

canvas.addEventListener('touchcancel', (e) => {
  e.preventDefault();
  joystick.active = false;
  joystick.visible = false;
  joystick.identifier = null;
  joystick.inputX = 0;
  joystick.inputY = 0;
  aimJoystick.active = false;
  aimJoystick.identifier = null;
  aimJoystick.inputX = 0;
  aimJoystick.inputY = 0;
}, { passive: false });

// Mouse tracking for aim direction (when autoAim is off)
let mouseX = 0, mouseY = 0;
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  // 计算瞄准方向（基于屏幕中心）
  const ox = canvas.width / 2;
  const oy = canvas.height / 2;
  aimDir = Math.atan2(e.clientY - oy, e.clientX - ox);
  if (!autoAim && player && gameRunning) {
    mouseAimDir = aimDir;
  }
});

// Auto-aim toggle
document.getElementById('auto-aim-checkbox').addEventListener('change', (e) => {
  autoAim = e.target.checked;
});




// --- Utility ---
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function angle(a, b) { return Math.atan2(b.y - a.y, b.x - a.x); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

// --- Zombie Types ---
function spawnZombie(difficulty) {
  const camL = camera.x - canvas.width / 2 - 100;
  const camR = camera.x + canvas.width / 2 + 100;
  const camT = camera.y - canvas.height / 2 - 100;
  const camB = camera.y + canvas.height / 2 + 100;

  let x, y;
  const side = randInt(0, 3);
  switch (side) {
    case 0: x = rand(camL, camR); y = camT; break;
    case 1: x = camR; y = rand(camT, camB); break;
    case 2: x = rand(camL, camR); y = camB; break;
    case 3: x = camL; y = rand(camT, camB); break;
  }
  x = clamp(x, 20, WORLD_W - 20);
  y = clamp(y, 20, WORLD_H - 20);

  let type = 'normal';
  const r = Math.random();
  if (difficulty > 120 && r < 0.12) type = 'tank';
  else if (difficulty > 30 && r < 0.25) type = 'fast';

  let hp, speed, radius, damage, xpValue;
  switch (type) {
    case 'fast':
      hp = 15 + difficulty * 0.5; speed = 120 + difficulty * 0.3; radius = 12; damage = 8; xpValue = 3; break;
    case 'tank':
      hp = 80 + difficulty * 2; speed = 40 + difficulty * 0.1; radius = 26; damage = 20; xpValue = 8; break;
    default:
      hp = 20 + difficulty * 0.8; speed = 60 + difficulty * 0.2; radius = 16; damage = 10; xpValue = 2;
  }

  zombies.push({
    x, y, hp, maxHp: hp,
    speed: speed * rand(0.85, 1.15), radius, damage, xpValue, type,
    hitFlash: 0, burnTimer: 0, burnDamage: 0,
    colorIndex: randInt(0, 4),
    slowTimer: 0, slowFactor: 1,
    debuffs: { chill: 0, poison: 0, bleed: 0, slow: 0 },
    chillFrozenTimer: 0,
    emSlowTimer: 0,
  });
}

function spawnWaveBoss(waveIndex) {
  const round = Math.floor(waveIndex / BOSS_DEFS.length);
  const bossInWave = waveIndex % BOSS_DEFS.length;
  const def = BOSS_DEFS[bossInWave];
  const hpMult = Math.pow(1.5, round); // 每轮HP x1.5
  if (waveState.boss && waveState.boss.hp > 0) waveState.boss.hp = 0; // 清除上一个boss

  const a = rand(0, Math.PI * 2);
  const spawnDist = 500;
  const bx = clamp(player.x + Math.cos(a) * spawnDist, 100, WORLD_W - 100);
  const by = clamp(player.y + Math.sin(a) * spawnDist, 100, WORLD_H - 100);

  waveState.boss = {
    x: bx, y: by,
    hp: def.hp * hpMult, maxHp: def.hp * hpMult,
    speed: def.speed,
    radius: def.radius,
    damage: def.damage,
    xpValue: def.xpValue * (round + 1),
    type: 'wave_boss',
    bossId: def.id,
    bossName: def.name,
    bossTitle: round > 0 ? `第${round+1}轮 ${def.title}` : def.title,
    color: def.color,
    eyeColor: def.eyeColor,
    hitFlash: 0,
    burnTimer: 0,
    burnDamage: 0,
    skillCooldowns: {},
    skillTimers: {},
    isCharging: false,
    chargeDir: 0,
    chargeSpeed: 0,
    chargeTimer: 0,
    frenzyTimer: 0,
    frenzyActive: false,
    isInvulnerable: false,
    invulnTimer: 0,
    phase: 1,
    shadowBarrierTimer: 0,
    warCryActive: false,
    warCryTimer: 0,
    animTimer: 0,
    debuffs: { chill: 0, poison: 0, bleed: 0, slow: 0 },
    chillFrozenTimer: 0,
    emSlowTimer: 0,
    roundNum: round,
  };

  for (const skill of def.skills) {
    waveState.boss.skillCooldowns[skill.id] = skill.cooldown * rand(0.5, 1);
  }

  waveState.bossAlive = true;
  waveState.waveCleared = false;
  bigAnnouncements.push({
    text: round > 0 ? `第${round+1}轮开始!` : `${def.bossTitle}: ${def.bossName}`,
    color: '#ff0000', life: 4
  });
  AudioSys.bossAppear();
}

// ============================================================
// BOSS AI & SKILLS
// ============================================================
function updateBoss(dt) {
  const boss = waveState.boss;
  if (!boss || !waveState.bossAlive) return;

  const def = BOSS_DEFS.find(d => d.id === boss.bossId);
  if (!def) return;

  boss.animTimer += dt;
  if (boss.hitFlash > 0) boss.hitFlash -= dt;
  if (boss.invulnTimer > 0) { boss.invulnTimer -= dt; boss.isInvulnerable = boss.invulnTimer > 0; }

  // Phase 2 at 50% hp
  if (boss.hp < boss.maxHp * 0.5 && boss.phase === 1) {
    boss.phase = 2;
    boss.speed *= 1.3;
    boss.damage *= 1.2;
    spawnParticles(boss.x, boss.y, boss.eyeColor, 30, 150, 0.8);
    addScreenShake(8, 0.5);
  }

  if (boss.frenzyTimer > 0) {
    boss.frenzyTimer -= dt;
    if (boss.frenzyTimer <= 0) boss.frenzyActive = false;
  }
  if (boss.warCryTimer > 0) {
    boss.warCryTimer -= dt;
    if (boss.warCryTimer <= 0) boss.warCryActive = false;
  }
  if (boss.shadowBarrierTimer > 0) {
    boss.shadowBarrierTimer -= dt;
    if (dist(boss, player) < boss.radius + 120) {
      if (player.invTimer <= 0) {
        const dmg = Math.max(1, 5 * dt * 60);
        player.hp -= dmg;
        if (!AudioSys._lastHurt || gameTime - AudioSys._lastHurt > 0.15) { AudioSys.hurt(); AudioSys._lastHurt = gameTime; }
        player.invTimer = 0.1;
        player.damageFlash = 0.1;
      }
    }
  }

  // Boss debuff: chill freeze
  if (boss.chillFrozenTimer > 0) {
    boss.chillFrozenTimer -= dt;
    // Skip movement while frozen
  } else if (!boss.isCharging) {
    const a = angle(boss, player);
    const spd = boss.speed * (boss.frenzyActive ? 1.8 : 1);
    boss.x += Math.cos(a) * spd * dt;
    boss.y += Math.sin(a) * spd * dt;
  }

  if (boss.isCharging) {
    boss.x += Math.cos(boss.chargeDir) * boss.chargeSpeed * dt;
    boss.y += Math.sin(boss.chargeDir) * boss.chargeSpeed * dt;
    boss.chargeTimer -= dt;
    if (boss.chargeTimer <= 0) {
      boss.isCharging = false;
    }
    if (dist(boss, player) < boss.radius + player.radius + 10 && player.invTimer <= 0) {
      const dmg = Math.max(1, boss.damage * 2 - player.armor - (player.passives.armor || 0) * 3);
      player.hp -= dmg;
      if (!AudioSys._lastHurt || gameTime - AudioSys._lastHurt > 0.15) { AudioSys.hurt(); AudioSys._lastHurt = gameTime; }
      player.invTimer = 0.8;
      player.damageFlash = 0.3;
      spawnDamageNumber(player.x, player.y, dmg, '#ff0');
      addScreenShake(10, 0.4);
      boss.isCharging = false;
    }
  }

  boss.x = clamp(boss.x, boss.radius, WORLD_W - boss.radius);
  boss.y = clamp(boss.y, boss.radius, WORLD_H - boss.radius);

    // Boss-player collision push
    const bpx = boss.x - player.x;
    const bpy = boss.y - player.y;
    const bpd = Math.sqrt(bpx * bpx + bpy * bpy);
    const bpMin = boss.radius + player.radius + 5;
    if (bpd < bpMin && bpd > 0.01) {
      boss.x += (bpx / bpd) * (bpMin - bpd);
      boss.y += (bpy / bpd) * (bpMin - bpd);
      boss.x = clamp(boss.x, boss.radius, WORLD_W - boss.radius);
      boss.y = clamp(boss.y, boss.radius, WORLD_H - boss.radius);
    }

  if (boss.burnTimer > 0) {
    boss.burnTimer -= dt;
    boss.hp -= boss.burnDamage * dt;
    if (Math.random() < 0.1) {
      spawnParticles(boss.x + rand(-boss.radius, boss.radius), boss.y + rand(-boss.radius, boss.radius), '#ff6600', 1, 40, 0.3);
    }
  }

  // Boss debuff damage: poison
  if (boss.debuffs && boss.debuffs.poison > 0) {
    boss.hp -= boss.debuffs.poison * 2 * dt;
  }

  if (!boss.isCharging && dist(boss, player) < boss.radius + player.radius && player.invTimer <= 0 && !boss.isInvulnerable) {
    const dmg = Math.max(1, boss.damage - player.armor - (player.passives.armor || 0) * 3);
    player.hp -= dmg;
    if (!AudioSys._lastHurt || gameTime - AudioSys._lastHurt > 0.15) { AudioSys.hurt(); AudioSys._lastHurt = gameTime; }
    player.invTimer = 0.6;
    player.damageFlash = 0.2;
    spawnDamageNumber(player.x, player.y, dmg, COLORS.damage);
    addScreenShake(6, 0.3);
  }

  for (const skill of def.skills) {
    boss.skillCooldowns[skill.id] -= dt;
    if (boss.skillCooldowns[skill.id] <= 0 && !boss.isCharging) {
      executeBossSkill(boss, skill, dt);
      const cdMult = boss.phase === 2 ? 0.7 : 1;
      boss.skillCooldowns[skill.id] = skill.cooldown * cdMult * rand(0.85, 1.15);
    }
  }

  // Boss death
  if (boss.hp <= 0) {
    waveState.bossAlive = false;
    waveState.waveCleared = true;
    waveState.bossDefeatedCount++;
    killCount++;
    const currentRound = boss.roundNum || 0;

    for (let i = 0; i < 50; i++) {
      spawnParticles(boss.x + rand(-30, 30), boss.y + rand(-30, 30), boss.eyeColor, 2, 200, 1);
    }
    spawnParticles(boss.x, boss.y, '#fff', 20, 250, 0.8);
    addScreenShake(15, 0.8);

    // Drop 30 gems (not if level >= 70)
    if (player.level < 70) {
      for (let g = 0; g < 30; g++) {
        gems.push({
          x: boss.x + rand(-40, 40),
          y: boss.y + rand(-40, 40),
          value: Math.ceil(def.xpValue / 30),
          radius: 8,
          color: COLORS.gem[randInt(0, COLORS.gem.length - 1)],
          magnetized: false,
        });
      }
    }

    // 检查是否通关当前轮
    const nextWave = waveState.currentWave + 1;
    if (nextWave > 0 && nextWave % BOSS_DEFS.length === 0) {
      bigAnnouncements.push({
        text: `恭喜通关第${currentRound + 1}轮!`,
        color: '#00ff00', life: 5
      });
      bigAnnouncements.push({
        text: `第${currentRound + 2}轮即将开始...`,
        color: '#ffff00', life: 4
      });
    }

    waveState.waveAnnounceTimer = 3;
    waveState.waveAnnounceText = `${def.name} 已被击败!`;
  }
}

function executeBossSkill(boss, skill, dt) {
  switch (skill.id) {
    case 'slam': {
      addScreenShake(8, 0.4);
      spawnParticles(boss.x, boss.y, '#ff8800', 15, 120, 0.5);
      const slamRadius = 200;
      const slamDamage = boss.damage * 1.5;
      if (dist(boss, player) < slamRadius) {
        if (player.invTimer <= 0) {
          const dmg = Math.max(1, slamDamage - player.armor - (player.passives.armor || 0) * 3);
          player.hp -= dmg;
          if (!AudioSys._lastHurt || gameTime - AudioSys._lastHurt > 0.15) { AudioSys.hurt(); AudioSys._lastHurt = gameTime; }
          player.invTimer = 0.5;
          player.damageFlash = 0.3;
          spawnDamageNumber(player.x, player.y, dmg, '#ff8800');
        }
        const ka = angle(boss, player);
        player.x += Math.cos(ka) * 80;
        player.y += Math.sin(ka) * 80;
      }
      lightnings.push({ x1: boss.x, y1: boss.y, x2: boss.x + slamRadius, y2: boss.y, life: 0.4, isExplosion: true, radius: slamRadius, color: '#ff8800' });
      for (const z of zombies) {
        if (dist(boss, z) < slamRadius && z !== boss) {
          z.hp -= 50;
          z.hitFlash = 0.2;
        }
      }
      break;
    }
    case 'summon': {
      const count = 5 + (boss.phase === 2 ? 3 : 0);
      for (let i = 0; i < count; i++) {
        const a = rand(0, Math.PI * 2);
        zombies.push({
          x: boss.x + Math.cos(a) * rand(60, 120),
          y: boss.y + Math.sin(a) * rand(60, 120),
          hp: 30 + gameTime * 0.3, maxHp: 30 + gameTime * 0.3,
          speed: (80 + gameTime * 0.15) * rand(0.9, 1.1), radius: 14,
          damage: 12, xpValue: 3, type: 'normal',
          hitFlash: 0, burnTimer: 0, burnDamage: 0,
          slowTimer: 0, slowFactor: 1,
          debuffs: { chill: 0, poison: 0, bleed: 0, slow: 0 },
          chillFrozenTimer: 0,
          emSlowTimer: 0,
        });
      }
      spawnParticles(boss.x, boss.y, '#2ecc71', 10, 80, 0.5);
      break;
    }
    case 'charge': {
      boss.isCharging = true;
      boss.chargeDir = angle(boss, player);
      boss.chargeSpeed = boss.speed * 5;
      boss.chargeTimer = 0.8;
      spawnParticles(boss.x, boss.y, '#ff4400', 8, 100, 0.3);
      break;
    }
    case 'poison_barrage': {
      const count = 16 + (boss.phase === 2 ? 8 : 0);
      for (let i = 0; i < count; i++) {
        const a = (Math.PI * 2 / count) * i + rand(-0.1, 0.1);
        bossProjectiles.push({
          x: boss.x, y: boss.y,
          vx: Math.cos(a) * 280,
          vy: Math.sin(a) * 280,
          damage: 15,
          radius: 10,
          life: 5,
          color: '#00ff88',
          type: 'poison',
          onHitEffect: 'poison',
          aoeRadius: 80,
        });
      }
      spawnParticles(boss.x, boss.y, '#00ff88', 12, 100, 0.4);
      break;
    }
    case 'poison_cloud': {
      const cloudCount = 2 + (boss.phase === 2 ? 1 : 0);
      for (let i = 0; i < cloudCount; i++) {
        const a = angle(boss, player);
        const d = rand(100, 250);
        bossZones.push({
          x: boss.x + Math.cos(a + rand(-0.5, 0.5)) * d,
          y: boss.y + Math.sin(a + rand(-0.5, 0.5)) * d,
          radius: rand(60, 100),
          damage: 8,
          life: 5,
          maxLife: 5,
          color: 'rgba(0,255,136,0.25)',
          borderColor: '#00ff88',
          type: 'poison',
          tickTimer: 0,
        });
      }
      break;
    }
    case 'corrupt_summon': {
      const count = 2 + (boss.phase === 2 ? 2 : 0);
      for (let i = 0; i < count; i++) {
        const a = rand(0, Math.PI * 2);
        zombies.push({
          x: boss.x + Math.cos(a) * 80,
          y: boss.y + Math.sin(a) * 80,
          hp: 120 + gameTime * 0.8, maxHp: 120 + gameTime * 0.8,
          speed: (50 + gameTime * 0.1) * rand(0.9, 1.1), radius: 22,
          damage: 18, xpValue: 6, type: 'tank',
          hitFlash: 0, burnTimer: 0, burnDamage: 0,
          slowTimer: 0, slowFactor: 1,
          debuffs: { chill: 0, poison: 0, bleed: 0, slow: 0 },
          chillFrozenTimer: 0,
          emSlowTimer: 0,
        });
      }
      spawnParticles(boss.x, boss.y, '#9b59b6', 10, 80, 0.5);
      break;
    }
    case 'rush': {
      boss.isCharging = true;
      boss.chargeDir = angle(boss, player);
      boss.chargeSpeed = boss.speed * 7;
      boss.chargeTimer = 1.0;
      spawnParticles(boss.x, boss.y, '#ff0000', 15, 150, 0.5);
      break;
    }
    case 'split': {
      const count = 3 + (boss.phase === 2 ? 3 : 0);
      for (let i = 0; i < count; i++) {
        const a = rand(0, Math.PI * 2);
        zombies.push({
          x: boss.x + Math.cos(a) * 60,
          y: boss.y + Math.sin(a) * 60,
          hp: 60 + gameTime * 0.5, maxHp: 60 + gameTime * 0.5,
          speed: (100 + gameTime * 0.2) * rand(0.9, 1.1), radius: 18,
          damage: 15, xpValue: 5, type: 'fast',
          hitFlash: 0, burnTimer: 0, burnDamage: 0,
          slowTimer: 0, slowFactor: 1,
          debuffs: { chill: 0, poison: 0, bleed: 0, slow: 0 },
          chillFrozenTimer: 0,
          emSlowTimer: 0,
        });
      }
      spawnParticles(boss.x, boss.y, '#c0392b', 20, 120, 0.6);
      addScreenShake(5, 0.3);
      break;
    }
    case 'frenzy': {
      boss.frenzyActive = true;
      boss.frenzyTimer = 8;
      spawnParticles(boss.x, boss.y, '#ff0000', 25, 150, 0.6);
      addScreenShake(5, 0.3);
      break;
    }
    case 'war_cry': {
      boss.warCryActive = true;
      boss.warCryTimer = 8;
      for (const z of zombies) {
        z.speed *= 1.5;
        z.damage *= 1.3;
      }
      spawnParticles(boss.x, boss.y, '#e74c3c', 20, 150, 0.6);
      addScreenShake(6, 0.3);
      break;
    }
    case 'formation': {
      for (let dir = 0; dir < 4; dir++) {
        const baseAngle = (Math.PI / 2) * dir + angle({ x: 0, y: 0 }, player);
        const count = 3 + (boss.phase === 2 ? 2 : 0);
        for (let i = 0; i < count; i++) {
          const a = baseAngle + rand(-0.4, 0.4);
          const d = rand(350, 500);
          zombies.push({
            x: player.x + Math.cos(a) * d,
            y: player.y + Math.sin(a) * d,
            hp: 40 + gameTime * 0.4, maxHp: 40 + gameTime * 0.4,
            speed: (90 + gameTime * 0.2) * rand(0.9, 1.1), radius: 15,
            damage: 14, xpValue: 4, type: 'fast',
            hitFlash: 0, burnTimer: 0, burnDamage: 0,
            slowTimer: 0, slowFactor: 1,
            debuffs: { chill: 0, poison: 0, bleed: 0, slow: 0 },
            chillFrozenTimer: 0,
            emSlowTimer: 0,
          });
        }
      }
      spawnParticles(boss.x, boss.y, '#e74c3c', 15, 100, 0.4);
      break;
    }
    case 'shadow_strike': {
      const pa = angle(player, boss);
      boss.x = clamp(player.x + Math.cos(pa + Math.PI) * 60, boss.radius, WORLD_W - boss.radius);
      boss.y = clamp(player.y + Math.sin(pa + Math.PI) * 60, boss.radius, WORLD_H - boss.radius);
      boss.isInvulnerable = true;
      boss.invulnTimer = 0.3;
      if (dist(boss, player) < boss.radius + player.radius + 30 && player.invTimer <= 0) {
        const dmg = Math.max(1, boss.damage * 1.8 - player.armor - (player.passives.armor || 0) * 3);
        player.hp -= dmg;
        if (!AudioSys._lastHurt || gameTime - AudioSys._lastHurt > 0.15) { AudioSys.hurt(); AudioSys._lastHurt = gameTime; }
        player.invTimer = 0.5;
        player.damageFlash = 0.3;
        spawnDamageNumber(player.x, player.y, dmg, '#e74c3c');
        addScreenShake(8, 0.3);
      }
      lightnings.push({ x1: boss.x - 100, y1: boss.y, x2: boss.x + 100, y2: boss.y, life: 0.3, isSlash: true });
      spawnParticles(boss.x, boss.y, '#2c3e50', 15, 120, 0.4);
      break;
    }
    case 'death_ray': {
      const rayAngle = angle(boss, player);
      bossProjectiles.push({
        x: boss.x, y: boss.y,
        vx: Math.cos(rayAngle) * 800,
        vy: Math.sin(rayAngle) * 800,
        damage: 5,
        radius: 20,
        life: 2,
        color: '#ff0040',
        type: 'ray',
        sourceX: boss.x,
        sourceY: boss.y,
        rayAngle: rayAngle,
        rayWidth: 40,
        tickTimer: 0,
      });
      addScreenShake(5, 0.2);
      break;
    }
    case 'soul_harvest': {
      const harvestRadius = 250;
      if (dist(boss, player) < harvestRadius) {
        if (player.invTimer <= 0) {
          const dmg = Math.max(1, boss.damage * 2 - player.armor - (player.passives.armor || 0) * 3);
          player.hp -= dmg;
          if (!AudioSys._lastHurt || gameTime - AudioSys._lastHurt > 0.15) { AudioSys.hurt(); AudioSys._lastHurt = gameTime; }
          player.invTimer = 0.5;
          player.damageFlash = 0.3;
          spawnDamageNumber(player.x, player.y, dmg, '#ff0040');
        }
      }
      lightnings.push({ x1: boss.x, y1: boss.y, x2: boss.x + harvestRadius, y2: boss.y, life: 0.6, isExplosion: true, radius: harvestRadius, color: '#ff0040' });
      for (const z of zombies) {
        if (dist(boss, z) < harvestRadius) {
          z.hp -= 100;
          z.hitFlash = 0.2;
          boss.hp = Math.min(boss.maxHp, boss.hp + 20);
        }
      }
      spawnParticles(boss.x, boss.y, '#ff0040', 30, 200, 0.8);
      addScreenShake(12, 0.5);
      break;
    }
    case 'revive': {
      const count = 10 + (boss.phase === 2 ? 5 : 0);
      for (let i = 0; i < count; i++) {
        const a = rand(0, Math.PI * 2);
        zombies.push({
          x: boss.x + Math.cos(a) * rand(80, 200),
          y: boss.y + Math.sin(a) * rand(80, 200),
          hp: 50 + gameTime * 0.5, maxHp: 50 + gameTime * 0.5,
          speed: (70 + gameTime * 0.15) * rand(0.9, 1.1), radius: 16,
          damage: 14, xpValue: 4, type: 'normal',
          hitFlash: 0, burnTimer: 0, burnDamage: 0,
          slowTimer: 0, slowFactor: 1,
          debuffs: { chill: 0, poison: 0, bleed: 0, slow: 0 },
          chillFrozenTimer: 0,
          emSlowTimer: 0,
        });
      }
      spawnParticles(boss.x, boss.y, '#1a1a2e', 25, 150, 0.6);
      break;
    }
    case 'shadow_barrier': {
      boss.shadowBarrierTimer = 6;
      spawnParticles(boss.x, boss.y, '#8e44ad', 20, 100, 0.5);
      break;
    }
  }
}

function updateBossProjectiles(dt) {
  for (let i = bossProjectiles.length - 1; i >= 0; i--) {
    const p = bossProjectiles[i];
    p.life -= dt;

    if (p.type === 'ray') {
      p.tickTimer += dt;
      if (p.tickTimer >= 0.1) {
        p.tickTimer -= 0.1;
        const dx = player.x - p.sourceX;
        const dy = player.y - p.sourceY;
        const rayAngle = Math.atan2(dy, dx);
        const angleDiff = Math.abs(rayAngle - p.rayAngle);
        const inRay = angleDiff < 0.3 || angleDiff > Math.PI * 2 - 0.3;
        const rayLen = Math.hypot(dx, dy);
        if (inRay && rayLen < 600 && player.invTimer <= 0) {
          player.hp -= p.damage;
          if (!AudioSys._lastHurt || gameTime - AudioSys._lastHurt > 0.15) { AudioSys.hurt(); AudioSys._lastHurt = gameTime; }
          player.invTimer = 0.15;
          player.damageFlash = 0.1;
          spawnDamageNumber(player.x, player.y, p.damage, '#ff0040');
        }
      }
      p.sourceX = waveState.boss ? waveState.boss.x : p.sourceX;
      p.sourceY = waveState.boss ? waveState.boss.y : p.sourceY;
      if (p.life <= 0) { bossProjectiles.splice(i, 1); continue; }
    } else {
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // Turret shield: destroy enemy projectiles within range of epic turrets
      for (const s of summons) {
        if (s.summonType === 'auto_turret' && s.epic) {
          if (dist(p, s) < 100) {
            spawnParticles(p.x, p.y, '#00ffff', 3, 60, 0.3);
            bossProjectiles.splice(i, 1);
            i--;
            continue;
          }
        }
      }

      if (p.life <= 0 || p.x < 0 || p.x > WORLD_W || p.y < 0 || p.y > WORLD_H) {
        bossProjectiles.splice(i, 1);
        continue;
      }

      if (dist(p, player) < p.radius + player.radius && player.invTimer <= 0) {
        const dmg = Math.max(1, p.damage - player.armor - (player.passives.armor || 0) * 3);
        player.hp -= dmg;
        if (!AudioSys._lastHurt || gameTime - AudioSys._lastHurt > 0.15) { AudioSys.hurt(); AudioSys._lastHurt = gameTime; }
        player.invTimer = 0.3;
        player.damageFlash = 0.2;
        spawnDamageNumber(player.x, player.y, dmg, p.color);
        if (p.onHitEffect === 'poison') {
          bossZones.push({
            x: player.x, y: player.y,
            radius: 40,
            damage: 5,
            life: 3,
            maxLife: 3,
            color: 'rgba(0,255,136,0.2)',
            borderColor: '#00ff88',
            type: 'poison',
            tickTimer: 0,
          });
        }
        bossProjectiles.splice(i, 1);
        continue;
      }
    }

    if (Math.random() < 0.3) {
      spawnParticles(p.x, p.y, p.color, 1, 30, 0.3);
    }
  }
}

function updateBossZones(dt) {
  for (let i = bossZones.length - 1; i >= 0; i--) {
    const z = bossZones[i];
    z.life -= dt;

    if (z.life <= 0) {
      bossZones.splice(i, 1);
      continue;
    }

    z.tickTimer += dt;
    if (z.tickTimer >= 0.5) {
      z.tickTimer -= 0.5;
      if (z.type !== 'fire' && dist(z, player) < z.radius + player.radius) {
        if (player.invTimer <= 0) {
          const dmg = Math.max(1, z.damage - player.armor - (player.passives.armor || 0) * 3);
          player.hp -= dmg;
          if (!AudioSys._lastHurt || gameTime - AudioSys._lastHurt > 0.15) { AudioSys.hurt(); AudioSys._lastHurt = gameTime; }
          player.damageFlash = 0.15;
          player.invTimer = 0.2;
          spawnDamageNumber(player.x, player.y, dmg, z.borderColor);
        }
      }
    }
  }
}

function tryDropXpMagnetGem(zombieX, zombieY) {

function pickupXpMagnetGem(gem, index) {
  for (const g of gems) {
    g.magnetized = true;
  }
  for (let i = xpMagnetGems.length - 1; i >= 0; i--) {
    if (i !== index) {
      const mg = xpMagnetGems[i];
      gems.push({
        x: mg.x, y: mg.y,
        value: 10, radius: 6,
        color: '#ffd700',
        magnetized: true,
      });

  const bonusXp = player.level * 20;
  player.xp += bonusXp;
  AudioSys.pickup();

  while (player.xp >= player.xpToNext) {
    player.xp -= player.xpToNext;
    player.level++;
    player.xpToNext = player.level <= 30
      ? Math.floor(10 * Math.pow(1.15, player.level - 1))
      : Math.floor(8 * Math.pow(1.12, player.level - 1));
    showLevelUpScreen();
  }

  const playerName = player.mpName || '玩家';
  bigAnnouncements.push({
    text: `${playerName} 触发了经验磁暴!`,
    color: '#ffd700',
    life: 3,
  });

  spawnParticles(gem.x, gem.y, '#ffd700', 30, 200, 1);
  spawnParticles(gem.x, gem.y, '#fff', 15, 150, 0.5);
  addScreenShake(10, 0.5);
}

// ============================================================
// DEBUFF SYSTEM
// ============================================================
function applyDebuff(zombie, type, amount) {
  if (!zombie.debuffs) return;
  if (type === 'chill') {
    zombie.debuffs.chill = Math.min(5, zombie.debuffs.chill + amount);
    if (zombie.debuffs.chill >= 5) {
      zombie.chillFrozenTimer = 2;
    }
  } else if (type === 'poison') {
    zombie.debuffs.poison += amount;
  } else if (type === 'bleed') {
    zombie.debuffs.bleed += amount;
  } else if (type === 'slow') {
    zombie.debuffs.slow += amount;
  }
}

function updateDebuffs(zombie, dt) {
  if (!zombie.debuffs) return;
  // Chill decay: 1 stack per 2 seconds
  if (zombie.debuffs.chill > 0) {
    zombie._chillDecayTimer = (zombie._chillDecayTimer || 0) + dt;
    if (zombie._chillDecayTimer >= 2) {
      zombie._chillDecayTimer -= 2;
      zombie.debuffs.chill = Math.max(0, zombie.debuffs.chill - 1);
    }
  }
  // Frozen timer
  if (zombie.chillFrozenTimer > 0) {
    zombie.chillFrozenTimer -= dt;
    if (zombie.chillFrozenTimer <= 0) {
      zombie.debuffs.chill = 0;
    }
  }
  // Poison decay: 1 stack per 3 seconds
  if (zombie.debuffs.poison > 0) {
    zombie._poisonDecayTimer = (zombie._poisonDecayTimer || 0) + dt;
    if (zombie._poisonDecayTimer >= 3) {
      zombie._poisonDecayTimer -= 3;
      zombie.debuffs.poison = Math.max(0, zombie.debuffs.poison - 1);
    }
    // Poison damage over time: each stack = 2/s
    zombie.hp -= zombie.debuffs.poison * 2 * dt;
    // At 10+ stacks: spawn poison cloud
    if (zombie.debuffs.poison >= 10 && !zombie._poisonCloudSpawned) {
      zombie._poisonCloudSpawned = true;
      poisonClouds.push({
        x: zombie.x, y: zombie.y,
        radius: 50, damage: 3,
        life: 4, maxLife: 4,
        color: 'rgba(0,200,50,0.2)',
        borderColor: '#00c832',
        tickTimer: 0,
      });
      setTimeout(() => { zombie._poisonCloudSpawned = false; }, 3000);
    }
  }
  // Bleed decay
  if (zombie.debuffs.bleed > 0) {
    zombie.hp -= zombie.debuffs.bleed * 1.5 * dt;
    zombie._bleedDecayTimer = (zombie._bleedDecayTimer || 0) + dt;
    if (zombie._bleedDecayTimer >= 1) {
      zombie._bleedDecayTimer -= 1;
      zombie.debuffs.bleed = Math.max(0, zombie.debuffs.bleed - 1);
    }
  }
  // Slow decay
  if (zombie.emSlowTimer > 0) {
    zombie.emSlowTimer -= dt;
    if (zombie.emSlowTimer <= 0) {
      zombie.debuffs.slow = 0;
    }
  }
}

// ============================================================
// WEAPON LOGIC
// ============================================================
function findNearestZombie(fromX, fromY, maxRange) {
  let best = null, bestDist = maxRange;
  const allTargets = waveState.boss && waveState.bossAlive ? [...zombies, waveState.boss] : zombies;
  for (const z of allTargets) {
    const d = dist({ x: fromX, y: fromY }, z);
    if (d < bestDist) { bestDist = d; best = z; }
  }
  return best;
}

function findNearestZombies(fromX, fromY, maxRange, count) {
  const allTargets = waveState.boss && waveState.bossAlive ? [...zombies, waveState.boss] : zombies;
  return allTargets
    .map(z => ({ z, d: dist({ x: fromX, y: fromY }, z) }))
    .filter(e => e.d < maxRange)
    .sort((a, b) => a.d - b.d)
    .slice(0, count)
    .map(e => e.z);
}

function fireWeapon(weapon, dt) {
  const def = WEAPON_DEFS[weapon.defId];
  if (!def) return;
  weapon.cooldownTimer -= dt;
  if (weapon.cooldownTimer > 0) return;

  const isEpic = weapon.level >= MAX_WEAPON_LEVEL;
  const epicMult = isEpic ? 2.5 : 1.0;

  // Active buff handling (mech_god etc.)
  if (def.type === 'active_buff') {
    weapon.cooldownTimer = def.cooldown;
    player.mechGodActive = true;
    bigAnnouncements.push({ text: '机神降临!', color: '#ff00ff', life: 3 });
    spawnParticles(player.x, player.y, '#ff00ff', 30, 150, 1);
    AudioSys.levelup();
    return;
  }

  // Passive auras and summons don't fire, handled separately
  if (def.type === 'aura' || def.type === 'summon') return;

  weapon.cooldownTimer = def.cooldown * player.cooldownMultiplier;

  // Determine aim direction
  let aimAngle = null;
  if (!autoAim) {
    if (aimJoystick.active && (aimJoystick.inputX !== 0 || aimJoystick.inputY !== 0)) {
      aimAngle = Math.atan2(aimJoystick.inputY, aimJoystick.inputX);
    } else {
      aimAngle = mouseAimDir;
    }
  }
  // 自动瞄准：先计算大致方向，确定枪口位置，再从枪口精确瞄准
  let preAimAngle = aimAngle !== null ? aimAngle : (autoAim ? aimDir : mouseAimDir);
  const preGunTipX = player.x + Math.cos(preAimAngle) * player.radius * 1.2;
  const preGunTipY = player.y + Math.sin(preAimAngle) * player.radius * 1.2;
  if (autoAim && aimAngle === null) {
    const preTargets = findNearestZombies(preGunTipX, preGunTipY, def.range || 500, 1);
    if (preTargets.length > 0) {
      aimAngle = Math.atan2(preTargets[0].y - preGunTipY, preTargets[0].x - preGunTipX);
    }
  }

  // 计算枪口位置（基于瞄准方向）
  const _fireAngle = aimAngle !== null ? aimAngle : (autoAim ? aimDir : mouseAimDir);
  const gunOffset = player.radius * 1.2;
  gunTipX = player.x + Math.cos(_fireAngle) * gunOffset;
  gunTipY = player.y + Math.sin(_fireAngle) * gunOffset;

  switch (def.type) {
    case 'projectile': {
      // Handle special weapons
      if (weapon.defId === 'freeze_gun') {
        fireFreezeGun(weapon, isEpic, epicMult, aimAngle);
      } else if (weapon.defId === 'poison_shot') {
        firePoisonShot(weapon, isEpic, epicMult, aimAngle);
      } else if (weapon.defId === 'split_gun') {
        fireSplitGun(weapon, isEpic, epicMult, aimAngle);
      } else {
        fireNormalProjectile(weapon, def, isEpic, epicMult, aimAngle);
      }
      break;
    }
    case 'lightning': {
      fireLightningWeapon(weapon, def, isEpic, epicMult);
      break;
    }
    case 'flame': {
      fireFlamethrower(weapon, def, isEpic, epicMult, aimAngle);
      break;
    }
  }
}

function fireNormalProjectile(weapon, def, isEpic, epicMult, aimAngle) {
  if (weapon.defId === 'shotgun') AudioSys.shotgun(); else AudioSys.shoot();
  // Handle shotgun Lv8 epic 360 spread
  if (weapon.defId === 'shotgun' && isEpic) {
    const is360Shot = Math.random() < 0.1;
    let totalProj;
    if (is360Shot) {
      totalProj = 18;
      for (let i = 0; i < totalProj; i++) {
        const a = (Math.PI * 2 / totalProj) * i + rand(-0.1, 0.1);
        const dmg = def.damage * player.damageMultiplier * (1 + (weapon.level - 1) * 0.15) * epicMult;
        projectiles.push({
          x: gunTipX + Math.cos(a) * 5,
          y: gunTipY + Math.sin(a) * 5,
          vx: Math.cos(a) * def.speed,
          vy: Math.sin(a) * def.speed,
          damage: dmg,
          radius: isEpic ? 6 : 4,
          range: def.range, traveled: 0,
          pierce: isEpic ? 1 : def.pierce + Math.floor((weapon.level - 1) / 2),
          color: COLORS.bullet,
          isExplosive: false,
          chainLightning: 0,
          weaponId: weapon.defId,
        });
      }
    } else {
      totalProj = 5 + (weapon.level - 1);
      let a;
      if (autoAim && aimAngle === null) {
        const targets = findNearestZombies(player.x, player.y, def.range, 1);
        if (targets.length === 0) return;
        const target = targets[0];
        a = angle(player, target) + rand(-def.spread, def.spread);
      } else {
        a = (aimAngle !== null ? aimAngle : 0) + rand(-def.spread, def.spread);
      }
      for (let i = 0; i < totalProj; i++) {
        const dmg = def.damage * player.damageMultiplier * (1 + (weapon.level - 1) * 0.15) * epicMult;
        projectiles.push({
          x: gunTipX,
          y: gunTipY,
          vx: Math.cos(a) * def.speed,
          vy: Math.sin(a) * def.speed,
          damage: dmg,
          radius: isEpic ? 6 : 4,
          range: def.range, traveled: 0,
          pierce: isEpic ? 1 : 0,
          color: COLORS.bullet,
          isExplosive: false,
          chainLightning: 0,
          weaponId: weapon.defId,
        });
      }
    }
    return;
  }

  // Pistol
  if (weapon.defId === 'pistol') {
    let a;
    if (autoAim && aimAngle === null) {
      const targets = findNearestZombies(player.x, player.y, def.range, 1);
      if (targets.length === 0) return;
      const target = targets[0];
      a = angle(player, target);
    } else {
      a = aimAngle !== null ? aimAngle : 0;
    }
    const dmg = def.damage * player.damageMultiplier * (1 + (weapon.level - 1) * 0.15) * epicMult;
    projectiles.push({
      x: gunTipX,
      y: gunTipY,
      vx: Math.cos(a) * def.speed,
      vy: Math.sin(a) * def.speed,
      damage: dmg,
      radius: isEpic ? 7 : 4,
      range: def.range, traveled: 0,
      pierce: isEpic ? 5 : def.pierce + Math.floor((weapon.level - 1) / 2),
      color: isEpic ? '#ff8800' : COLORS.bullet,
      isExplosive: isEpic,
      chainLightning: 0,
      weaponId: weapon.defId,
    });
    return;
  }

  // SMG
  if (weapon.defId === 'smg') {
    let a;
    if (autoAim && aimAngle === null) {
      const targets = findNearestZombies(player.x, player.y, def.range, 1);
      if (targets.length === 0) return;
      const target = targets[0];
      a = angle(player, target) + rand(-def.spread, def.spread);
    } else {
      a = (aimAngle !== null ? aimAngle : 0) + rand(-def.spread, def.spread);
    }
    const dmg = def.damage * player.damageMultiplier * (1 + (weapon.level - 1) * 0.15) * epicMult;
    projectiles.push({
      x: gunTipX,
      y: gunTipY,
      vx: Math.cos(a) * def.speed,
      vy: Math.sin(a) * def.speed,
      damage: dmg,
      radius: isEpic ? 5 : 3,
      range: def.range, traveled: 0,
      pierce: 0,
      color: COLORS.bullet,
      isExplosive: false,
      chainLightning: isEpic ? 3 : 0,
      weaponId: weapon.defId,
    });
    return;
  }

  // Generic projectile
  let targets = [];
  const isCircular = def.circularSpread;
  if (!isCircular && autoAim && aimAngle === null) {
    targets = findNearestZombies(player.x, player.y, def.range, def.projCount);
  }
  if (!isCircular && autoAim && aimAngle === null && targets.length === 0) return;
  let totalProj = def.projCount + player.projectileCount - 1;
  for (let i = 0; i < totalProj; i++) {
    let a;
    if (isCircular) {
      // 圆形均匀分布向外射击，每帧旋转一点
      a = (Math.PI * 2 / totalProj) * i + gameTime * 3;
    } else if (autoAim && aimAngle === null) {
      const target = targets[i % targets.length];
      a = angle({x: gunTipX, y: gunTipY}, target);
    } else {
      a = aimAngle !== null ? aimAngle : 0;
    }
    const spread = def.spread > 0 ? rand(-def.spread, def.spread) : 0;
    const finalAngle = a + spread;
    const dmg = def.damage * player.damageMultiplier * (1 + (weapon.level - 1) * 0.15) * epicMult;
    projectiles.push({
      x: gunTipX,
      y: gunTipY,
      vx: Math.cos(finalAngle) * def.speed,
      vy: Math.sin(finalAngle) * def.speed,
      damage: dmg,
      radius: 4, range: def.range, traveled: 0,
      pierce: def.pierce + Math.floor((weapon.level - 1) / 2),
      color: COLORS.bullet,
      isExplosive: false,
      chainLightning: 0,
      weaponId: weapon.defId,
    });
  }
}

function fireSplitGun(weapon, isEpic, epicMult, aimAngle) {
  AudioSys.shoot();
  const def = WEAPON_DEFS.split_gun;
  let a;
  if (autoAim && aimAngle === null) {
    const targets = findNearestZombies(player.x, player.y, def.range, 1);
    if (targets.length === 0) return;
    const target = targets[0];
    a = angle(player, target);
  } else {
    a = aimAngle !== null ? aimAngle : 0;
  }
  const dmg = def.damage * player.damageMultiplier * (1 + (weapon.level - 1) * 0.15) * epicMult;
  projectiles.push({
    x: gunTipX,
    y: gunTipY,
    vx: Math.cos(a) * def.speed,
    vy: Math.sin(a) * def.speed,
    damage: dmg,
    radius: 5, range: def.range, traveled: 0,
    pierce: 0,
    color: '#aa44ff',
    isExplosive: false,
    chainLightning: 0,
    weaponId: 'split_gun',
    splitOnHit: true,
    splitCount: isEpic ? 5 : 3,
    splitCanSplit: isEpic,
  });
}

function fireFreezeGun(weapon, isEpic, epicMult, aimAngle) {
  AudioSys.shoot();
  const def = WEAPON_DEFS.freeze_gun;
  let a;
  if (autoAim && aimAngle === null) {
    const targets = findNearestZombies(player.x, player.y, def.range, 1);
    if (targets.length === 0) return;
    const target = targets[0];
    a = angle({x: gunTipX, y: gunTipY}, target);
  } else {
    a = aimAngle !== null ? aimAngle : 0;
  }
  // 伤害 = 基础15 * 升级加成(每级+20%) + 每级额外+10
  const dmg = def.damage * player.damageMultiplier * (1 + (weapon.level - 1) * 0.2) * epicMult + (weapon.level - 1) * 10;
  projectiles.push({
    x: gunTipX,
    y: gunTipY,
    vx: Math.cos(a) * def.speed,
    vy: Math.sin(a) * def.speed,
    damage: dmg,
    radius: 5, range: def.range, traveled: 0,
    pierce: 0,
    color: '#88ccff',
    isExplosive: false,
    chainLightning: 0,
    weaponId: 'freeze_gun',
    splitOnHit: true,
    splitCount: 2 + (weapon.level - 1) * 2, // 每次升级分裂+2
    splitRange: 600, // 分裂弹道射程600
    splitCanSplit: isEpic, // LV8史诗可二次分裂
    epicSplitCount: isEpic ? 5 : 0, // 二次分裂5个弹道
    freezeOnHit: true,
    freezeStacks: isEpic ? 2 : 1,
  });
}

function firePoisonShot(weapon, isEpic, epicMult, aimAngle) {
  const def = WEAPON_DEFS.poison_shot;
  const isMax = weapon.level >= MAX_WEAPON_LEVEL;
  const projCount = isMax ? 18 : 1 + (weapon.level - 1); // 每次升级+1弹道
  const range = isMax ? 1000 : def.range;
  let a;
  if (autoAim && aimAngle === null) {
    const targets = findNearestZombies(player.x, player.y, range, 1);
    if (targets.length === 0) return;
    a = angle({x: gunTipX, y: gunTipY}, targets[0]);
  } else {
    a = aimAngle !== null ? aimAngle : 0;
  }
  // 每次升级+5伤害
  const dmg = (def.damage + (weapon.level - 1) * 5) * player.damageMultiplier * epicMult;
  for (let i = 0; i < projCount; i++) {
    const spreadAngle = isMax ? (Math.PI * 2 / projCount) * i : 0;
    const finalA = a + spreadAngle;
    projectiles.push({
      x: gunTipX,
      y: gunTipY,
      vx: Math.cos(finalA) * def.speed,
      vy: Math.sin(finalA) * def.speed,
      damage: dmg,
      radius: 6, range: range, traveled: 0,
      pierce: 0,
      color: '#44ff44',
      isExplosive: false,
      chainLightning: 0,
      weaponId: 'poison_shot',
      poisonOnHit: true,
      poisonDmg: dmg * 0.5,
      poisonDuration: 3,
      poisonStacks: isEpic ? 3 : 1,
      aoeRadius: 60,
      aoePoison: true,
      isEpic: isEpic,
      createPoisonCloud: isMax,
    });
  }
}

function fireLightningWeapon(weapon, def, isEpic, epicMult) {
  const chainCount = def.chains + weapon.level - 1 + (isEpic ? 6 : 0);
  const targets = findNearestZombies(player.x, player.y, def.range, chainCount);
  if (targets.length === 0) return;
  let prev = { x: player.x, y: player.y };
  const dmg = def.damage * player.damageMultiplier * (1 + (weapon.level - 1) * 0.2) * epicMult;
  for (const t of targets) {
    t.hp -= dmg;
    t.hitFlash = 0.15;
    if (isEpic && t.stunTimer === undefined) {
      t.stunTimer = 1;
    } else if (isEpic) {
      t.stunTimer = 1;
    }
    lightnings.push({ x1: prev.x, y1: prev.y, x2: t.x, y2: t.y, life: 0.2 });
    spawnDamageNumber(t.x, t.y, dmg, '#00ffff');
    spawnParticles(t.x, t.y, '#00ffff', 3, 80, 0.3);
    prev = t;
  }
  // Epic: arc connecting all targets visually
  if (isEpic && targets.length >= 2) {
    for (let i = 0; i < targets.length - 1; i++) {
      lightnings.push({ x1: targets[i].x, y1: targets[i].y, x2: targets[i + 1].x, y2: targets[i + 1].y, life: 0.15, color: '#00ccff' });
    }
  }
}

function fireFlamethrower(weapon, def, isEpic, epicMult, aimAngle) {
  if (!AudioSys._lastFlame || gameTime - AudioSys._lastFlame > 0.1) { AudioSys.flamethrower(); AudioSys._lastFlame = gameTime; }
  let flameAngle;
  if (autoAim) {
    const target = findNearestZombie(player.x, player.y, def.range);
    flameAngle = target ? angle(player, target) : angle(player, { x: player.x + 100, y: player.y });
  } else {
    flameAngle = aimAngle !== null ? aimAngle : angle(player, { x: player.x + 100, y: player.y });
  }
  const dmg = def.damage * player.damageMultiplier * (1 + (weapon.level - 1) * 0.2) * epicMult;

  if (isEpic) {
    const tornadoRadius = weapon.level >= 8 ? 37.5 : 25; // LV8时1.5倍
    const tornadoSpeed = weapon.level >= 8 ? 240 : 120; // LV8时2倍
    const tornado = {
      x: gunTipX, y: gunTipY,
      vx: 0, vy: 0,
      radius: tornadoRadius, damage: dmg,
      life: 3, maxLife: 3,
      isTornado: true,
      burnGroundTimer: 0,
      isLv8Tornado: weapon.level >= 8,
    };
    if (flameAngle !== null) {
      tornado.vx = Math.cos(flameAngle) * tornadoSpeed;
      tornado.vy = Math.sin(flameAngle) * tornadoSpeed;
    }
    flames.push(tornado);
  } else {
    for (let i = 0; i < 3; i++) {
      const fa = flameAngle + rand(-0.3, 0.3);
      const fd = rand(20, def.range + (weapon.level - 1) * 20);
      flames.push({
        x: gunTipX + Math.cos(fa) * fd,
        y: gunTipY + Math.sin(fa) * fd,
        radius: rand(8, 16), damage: dmg,
        life: rand(0.2, 0.5), maxLife: 0.5,
      });
    }
  }
}

// ============================================================
// SUMMON WEAPONS (Mechanist Class)
// ============================================================
function updateSummonWeapons(dt) {
  const classDef = CLASS_DEFS[player.classId];
  if (!classDef || !classDef.summonTypes) return;

  // 机神效果：增加desiredCount乘数和攻速乘数
  const godCountMult = player.mechGodActive ? 2 : 1;
  const godSpeedMult = player.mechGodActive ? 1.5 : 1;

  // Get all summon weapon instances
  const summonWeapons = player.weapons.filter(w => {
    const def = WEAPON_DEFS[w.defId];
    return (classDef.summonTypes && classDef.summonTypes.includes(w.defId)) || (def && def.type === 'summon');
  });

  // Count current summons by type
  const summonCounts = {};
  for (const s of summons) {
    summonCounts[s.summonType] = (summonCounts[s.summonType] || 0) + 1;
  }

  // Spawn/update summons for each summon weapon
  for (const w of summonWeapons) {
    const defId = w.defId;
    const lv = w.level;
    const isEpic = lv >= MAX_WEAPON_LEVEL;
    const baseDmg = WEAPON_DEFS[defId] ? 8 + lv * 2 : 10;

    let desiredCount = 0;
    if (defId === 'drone') {
      desiredCount = 1 + (lv - 1) * 2 + (isEpic ? 3 : 0);
    } else if (defId === 'disc_blade') {
      desiredCount = 2 + (lv - 1) * 2 + (isEpic ? 2 : 0);
    } else if (defId === 'auto_turret') {
      // Turret placement: every 20 seconds can place 1 new
      if (w.turretPlaceTimer === undefined) w.turretPlaceTimer = 0;
      w.turretPlaceTimer -= dt;
      desiredCount = 1 + (lv - 1) + (isEpic ? 2 : 0);
    } else if (defId === 'mech_warrior') {
      desiredCount = 1 + (lv - 1) + (isEpic ? 3 : 0);
    }

    desiredCount = Math.max(1, Math.ceil(desiredCount * godCountMult));

    // Use summonType for counting since that's what summonCounts uses
    const countKey = (WEAPON_DEFS[defId] && WEAPON_DEFS[defId].summonType) ? WEAPON_DEFS[defId].summonType : defId;
    const currentCount = summonCounts[countKey] || 0;

    // Spawn new summons
    if (defId !== 'auto_turret') {
      while ((summonCounts[countKey] || 0) < desiredCount) {
        spawnSummonEntity(defId, w, isEpic);
        summonCounts[countKey] = (summonCounts[countKey] || 0) + 1;
      }
      // Trim excess
      const trimType = WEAPON_DEFS[defId] && WEAPON_DEFS[defId].summonType ? WEAPON_DEFS[defId].summonType : defId;
      while ((summonCounts[trimType] || 0) > desiredCount) {
        const idx = summons.findIndex(s => s.summonType === trimType);
        if (idx >= 0) {
          summons.splice(idx, 1);
          summonCounts[trimType]--;
        } else break;
      }
    } else {
      // Auto turret: only place when timer ready and under max
      if (w.turretPlaceTimer <= 0 && (summonCounts[countKey] || 0) < desiredCount) {
        w.turretPlaceTimer = 20;
        spawnSummonEntity(defId, w, isEpic);
        summonCounts[countKey] = (summonCounts[countKey] || 0) + 1;
      }
      // Trim excess (oldest dies when max+1 placed)
      const trimType2 = WEAPON_DEFS[defId] && WEAPON_DEFS[defId].summonType ? WEAPON_DEFS[defId].summonType : defId;
      while ((summonCounts[trimType2] || 0) > desiredCount) {
        const idx = summons.findIndex(s => s.summonType === trimType2);
        if (idx >= 0) {
          spawnParticles(summons[idx].x, summons[idx].y, '#888', 5, 60, 0.3);
          summons.splice(idx, 1);
          summonCounts[trimType2]--;
        } else break;
      }
    }
  }

  // Update each summon
  for (let i = summons.length - 1; i >= 0; i--) {
    const s = summons[i];
    const sw = summonWeapons.find(w => w.defId === s.summonType);
    if (!sw) { summons.splice(i, 1); continue; }
    const sEpic = sw.level >= MAX_WEAPON_LEVEL;
    s.epic = sEpic;
    s.weaponLevel = sw.level;

    switch (s.summonType) {
      case 'drone':
        updateDrone(s, dt);
        break;
      case 'disc_blade':
        updateDiscBlade(s, dt);
        break;
      case 'auto_turret':
        updateAutoTurret(s, dt);
        break;
      case 'mech_warrior':
        updateMechWarrior(s, dt);
        break;
    }

    // Remove dead summons
    if (s.hp <= 0) {
      spawnParticles(s.x, s.y, '#888', 8, 80, 0.4);
      summons.splice(i, 1);
    }
  }

  // Summon-summon and summon-player collision push
  for (let i = 0; i < summons.length; i++) {
    const si = summons[i];
    if (si.summonType === 'disc_blade') continue; // 旋转飞刃无碰撞
    // Push from player
    const pdx = si.x - player.x;
    const pdy = si.y - player.y;
    const pd = Math.sqrt(pdx * pdx + pdy * pdy);
    const pMin = si.radius + player.radius;
    if (pd < pMin && pd > 0.01) {
      si.x += (pdx / pd) * (pMin - pd);
      si.y += (pdy / pd) * (pMin - pd);
    }
    // Push from other summons
    for (let j = i + 1; j < summons.length; j++) {
      const sj = summons[j];
      const ddx = si.x - sj.x;
      const ddy = si.y - sj.y;
      const dd = Math.sqrt(ddx * ddx + ddy * ddy);
      const mDist = si.radius + sj.radius;
      if (dd < mDist && dd > 0.01) {
        const push = (mDist - dd) * 0.5;
        const nx = ddx / dd;
        const ny = ddy / dd;
        si.x += nx * push; si.y += ny * push;
        sj.x -= nx * push; sj.y -= ny * push;
      }
    }
  }

  // Update summon projectiles
  for (let i = summonProjectiles.length - 1; i >= 0; i--) {
    const p = summonProjectiles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;

    if (p.life <= 0 || p.x < 0 || p.x > WORLD_W || p.y < 0 || p.y > WORLD_H) {
      summonProjectiles.splice(i, 1);
      continue;
    }

    // Check hit zombies and boss
    const allTargets = waveState.boss && waveState.bossAlive ? [...zombies, waveState.boss] : zombies;
    let hit = false;
    for (const z of allTargets) {
      if (dist(p, z) < p.radius + z.radius) {
        if (z.isInvulnerable) continue;
        z.hp -= p.damage;
        z.hitFlash = 0.1;
        if (!z.lastHitSound || gameTime - z.lastHitSound > 0.1) { AudioSys.hit(); z.lastHitSound = gameTime; }
        spawnDamageNumber(z.x, z.y, p.damage, '#00ddff');
        spawnParticles(p.x, p.y, p.color, 2, 40, 0.2);
        if (p.pierce && p.pierce > 0) {
          p.pierce--;
        } else {
          hit = true;
        }
        break;
      }
    }
    if (hit) summonProjectiles.splice(i, 1);
  }
}

function spawnSummonEntity(summonType, weapon, isEpic) {
  const epicMult = isEpic ? 1.5 : 1;
  const baseDmg = (8 + weapon.level * 5) * epicMult;
  let entity;
  switch (summonType) {
    case 'drone':
      entity = {
        x: player.x + rand(-50, 50), y: player.y + rand(-50, 50),
        hp: isEpic ? 80 : 40, maxHp: isEpic ? 80 : 40,
        damage: baseDmg * player.damageMultiplier,
        speed: 150, radius: isEpic ? 14 : 10,
        attackTimer: 0, attackCooldown: isEpic ? 0.4 : 0.8,
        summonType: 'drone', epic: isEpic,
        targetId: null, weaponLevel: weapon.level,
        angle: rand(0, Math.PI * 2),
        shieldHp: isEpic ? 20 : 0,
      };
      break;
    case 'disc_blade':
      entity = {
        x: player.x, y: player.y,
        hp: 9999, maxHp: 9999,
        damage: baseDmg * player.damageMultiplier,
        speed: isEpic ? 12 : 7.5, radius: isEpic ? 44 : 24,
        attackTimer: 0, attackCooldown: 0.1,
        summonType: 'disc_blade', epic: isEpic,
        targetId: null, weaponLevel: weapon.level,
        angle: rand(0, Math.PI * 2),
        orbitRadius: 160,
      };
      break;
    case 'auto_turret':
      entity = {
        x: player.x + rand(-30, 30), y: player.y + rand(-30, 30),
        hp: isEpic ? 150 : 60, maxHp: isEpic ? 150 : 60,
        damage: baseDmg * player.damageMultiplier * 1.5,
        speed: 80, radius: isEpic ? 16 : 12,
        attackTimer: 0, attackCooldown: isEpic ? 0.8 : 1.5,
        summonType: 'auto_turret', epic: isEpic,
        targetId: null, weaponLevel: weapon.level,
        laserTarget: null,
        range: 600 + (weapon.level - 1) * 50,
        shieldAura: isEpic,
      };
      break;
    case 'mech_beast':
      entity = {
        x: player.x + rand(-40, 40), y: player.y + rand(-40, 40),
        hp: isEpic ? 100 : 50, maxHp: isEpic ? 100 : 50,
        damage: baseDmg * player.damageMultiplier * 1.5,
        speed: isEpic ? 180 : 120, radius: isEpic ? 18 : 14,
        attackTimer: 0, attackCooldown: 0.5,
        summonType: 'mech_beast', epic: isEpic,
        targetId: null, weaponLevel: weapon.level,
      };
      break;
    case 'mech_warrior':
      entity = {
        x: player.x + rand(-50, 50), y: player.y + rand(-50, 50),
        hp: isEpic ? 80 : 40, maxHp: isEpic ? 80 : 40,
        damage: baseDmg * player.damageMultiplier,
        speed: 100, radius: isEpic ? 14 : 10,
        attackTimer: 0, attackCooldown: isEpic ? 0.27 : 0.5,
        summonType: 'mech_warrior', epic: isEpic,
        targetId: null, weaponLevel: weapon.level,
        range: 800,
      };
      break;
  }
  summons.push(entity);
}

function updateDrone(s, dt) {
  // Float near player within 150px
  const dToPlayer = dist(s, player);
  if (dToPlayer > 150) {
    const a = angle(s, player);
    s.x += Math.cos(a) * s.speed * dt;
    s.y += Math.sin(a) * s.speed * dt;
  } else {
    // Idle float
    s.angle += dt;
    s.x += Math.cos(s.angle) * 20 * dt;
    s.y += Math.sin(s.angle) * 20 * dt;
  }

  // Find and move toward nearest enemy within 250px
  const target = findNearestZombie(s.x, s.y, 800, 1);
  if (target && dToPlayer < 250) {
    const dToTarget = dist(s, target);
    if (dToTarget > 80) {
      const a = angle(s, target);
      s.x += Math.cos(a) * s.speed * dt;
      s.y += Math.sin(a) * s.speed * dt;
    }
  }

  // Shoot
  s.attackTimer -= dt * (player.mechGodActive ? 1.5 : 1);
  if (s.attackTimer <= 0 && target) {
    s.attackTimer = s.attackCooldown;
    const a = angle(s, target);
    const bulletSpeed = 500;
    const dmg = s.damage * (s.damageBoost || 1);
    summonProjectiles.push({
      x: s.x, y: s.y,
      vx: Math.cos(a) * bulletSpeed,
      vy: Math.sin(a) * bulletSpeed,
      damage: dmg,
      radius: 3,
      life: 1.5,
      color: '#00ddff',
      pierce: s.epic ? 99 : 0,
    });
    if (s.epic) {
      lightnings.push({
        x1: s.x, y1: s.y,
        x2: target.x, y2: target.y,
        life: 0.1,
        isLaser: true,
        color: '#00ddff',
      });
    }
  }

  // Epic: shield absorbs damage (checked in projectile code)
}

function updateDiscBlade(s, dt) {
  // Orbit player
  s.angle += s.speed * dt;
  s.x = player.x + Math.cos(s.angle) * s.orbitRadius;
  s.y = player.y + Math.sin(s.angle) * s.orbitRadius;

  // Damage enemies on contact
  const allTargets = waveState.boss && waveState.bossAlive ? [...zombies, waveState.boss] : zombies;
  for (const z of allTargets) {
    if (dist(s, z) < s.radius + z.radius) {
      z.hp -= s.damage * (s.damageBoost || 1) * dt * 10; // DPS
      z.hitFlash = 0.05;
      // Epic: bleeding DoT
      if (s.epic) {
        applyDebuff(z, 'bleed', 0.5);
      }
    }
  }

  // Epic: bleeding trail
  if (s.epic && Math.random() < 0.3) {
    frostTrails.push({
      x: s.x, y: s.y,
      radius: 15,
      life: 1.0,
      maxLife: 1.0,
      slowFactor: 1,
      isBleed: true,
      damage: s.damage * (s.damageBoost || 1) * 0.5,
      tickTimer: 0,
    });
  }
}

function updateAutoTurret(s, dt) {
  // 自由移动：在玩家周围300px范围内巡逻
  const dToPlayer = dist(s, player);
  if (dToPlayer > 300) {
    // 回归玩家附近
    const a = angle(s, player);
    s.x += Math.cos(a) * s.speed * dt;
    s.y += Math.sin(a) * s.speed * dt;
  } else {
    // 巡逻：朝最近敌人方向缓慢移动
    const target = findNearestZombie(s.x, s.y, s.range, 1);
    if (target) {
      const a = angle(s, target);
      if (dist(s, target) > s.range * 0.5) {
        s.x += Math.cos(a) * s.speed * dt;
        s.y += Math.sin(a) * s.speed * dt;
      }
    } else {
      // 无敌人时在玩家附近随机移动
      s.wanderAngle = (s.wanderAngle || rand(0, Math.PI * 2)) + rand(-0.5, 0.5) * dt;
      s.x += Math.cos(s.wanderAngle) * s.speed * 0.5 * dt;
      s.y += Math.sin(s.wanderAngle) * s.speed * 0.5 * dt;
    }
  }

  // 攻击逻辑
  s.attackTimer -= dt * (player.mechGodActive ? 1.5 : 1);
  if (s.attackTimer <= 0) {
    s.attackTimer = s.attackCooldown;
    const target = findNearestZombie(s.x, s.y, s.range, 1);
    if (target) {
      const a = angle(s, target);
      s.laserTarget = target;
      for (let fi = 0; fi < 3; fi++) {
        const fa = a + rand(-0.3, 0.3);
        const fd = rand(10, s.range * 0.6);
        flames.push({
          x: s.x + Math.cos(fa) * fd,
          y: s.y + Math.sin(fa) * fd,
          radius: rand(8, 16),
          damage: s.damage * (s.damageBoost || 1),
          life: rand(0.2, 0.5),
          maxLife: 0.5,
          sourceIsAlly: true,
        });
      }
    } else {
      s.laserTarget = null;
    }
  }
}

function updateMechWarrior(s, dt) {
  // Stay near player within 300px, shoot at nearest enemy
  const dToPlayer = dist(s, player);
  if (dToPlayer > 300) {
    const a = angle(s, player);
    s.x += Math.cos(a) * s.speed * dt;
    s.y += Math.sin(a) * s.speed * dt;
  }

  s.attackTimer -= dt * (player.mechGodActive ? 1.5 : 1);
  if (s.attackTimer <= 0) {
    s.attackTimer = s.attackCooldown;
    const target = findNearestZombie(s.x, s.y, s.range, 1);
    if (target) {
      const a = angle(s, target);
      summonProjectiles.push({
        x: s.x, y: s.y,
        vx: Math.cos(a) * 400,
        vy: Math.sin(a) * 400,
        damage: s.damage * (s.damageBoost || 1),
        radius: 4,
        life: 1,
        color: '#ff8800',
        pierce: s.epic ? 99 : 0,
      });
    }
  }
}

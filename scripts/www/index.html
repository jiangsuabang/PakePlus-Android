// PASSIVE AURA WEAPONS (Scientist)
// ============================================================
function updatePassiveAuras(dt) {
  for (const w of player.weapons) {
    const def = WEAPON_DEFS[w.defId];
    if (!def || def.type !== 'aura') continue;

    const isEpic = w.level >= MAX_WEAPON_LEVEL;
    let range = def.range;
    let dmgPerSec = def.damage || 0;

    if (def.debuffType === 'radiation') {
      const auraDmg = def.damage * (1 + (w.level - 1) * 0.3); // 每级+30%伤害
      range = isEpic ? 1000 : def.range + (w.level - 1) * 30; // LV8=1000
      dmgPerSec = auraDmg;
      if (isEpic) dmgPerSec *= 3;

      // Damage enemies in range
      const allTargets = waveState.boss && waveState.bossAlive ? [...zombies, waveState.boss] : zombies;
      for (const z of allTargets) {
        if (z.isInvulnerable) continue;
        if (dist(player, z) < range + z.radius) {
          z.hp -= dmgPerSec * dt;
          if (Math.random() < 0.1) {
            spawnParticles(z.x + rand(-z.radius, z.radius), z.y + rand(-z.radius, z.radius), '#aaff00', 1, 30, 0.3);
          }
        }
      }
    } else if (def.debuffType === 'em_slow') {
      range = isEpic ? 150 : def.range + w.level * 50;
      const slowAmount = isEpic ? 0.8 : Math.min(0.3 + w.level * 0.05, 0.8);
      const dmgPerSecEpic = isEpic ? 3 * w.level : 0;

      const allTargets = waveState.boss && waveState.bossAlive ? [...zombies, waveState.boss] : zombies;
      for (const z of allTargets) {
        if (dist(player, z) < range + z.radius) {
          z.debuffs.slow += slowAmount;
          if (z.debuffs.slow > 0.9) z.debuffs.slow = 0.9;
          z.emSlowTimer = 0.5;
          if (isEpic && dmgPerSecEpic > 0) {
            z.hp -= dmgPerSecEpic * dt;
          }
        }
      }
    } else if (def.debuffType === 'toxic_aura') {
      range = def.range + (w.level - 1) * 50; // 每次升级+50范围
      const stacksPerSec = 2; // 叠加速度x2 (原来是1)

      const allTargets = waveState.boss && waveState.bossAlive ? [...zombies, waveState.boss] : zombies;
      for (const z of allTargets) {
        if (dist(player, z) < range + z.radius) {
          applyDebuff(z, 'poison', stacksPerSec * dt);
          // 毒素debuff大于20时形成毒气云
          if (z.debuffs.poison >= 20 && !z._toxicCloudSpawned) {
            z._toxicCloudSpawned = true;
            poisonClouds.push({
              x: z.x, y: z.y,
              radius: 80, damage: 5,
              life: 6, maxLife: 6,
            });
          }
        }
      }
    } else if (def.debuffType === 'burn') {
      const auraDmg = def.damage + (w.level - 1) * 5; // 每次升级+5伤害
      range = def.range + (w.level - 1) * 30; // 每次升级+30范围
      const burnDps = auraDmg * (isEpic ? 3 : 1);

      const allTargets = waveState.boss && waveState.bossAlive ? [...zombies, waveState.boss] : zombies;
      for (const z of allTargets) {
        if (z.isInvulnerable) continue;
        if (dist(player, z) < range + z.radius) {
          // 灼烧debuff可叠加
          z.burnStacks = (z.burnStacks || 0) + burnDps * dt;
          const stackCount = Math.floor(z.burnStacks);
          const actualDmg = stackCount * 2 * dt; // 每层2伤害/秒
          z.hp -= actualDmg;
          
          // 粒子效果，叠加越多粒子越大
          const particleSize = Math.min(30, 10 + stackCount * 2);
          if (!z._burnDotTimer || gameTime - z._burnDotTimer > 0.5) {
            z._burnDotTimer = gameTime;
            spawnParticles(z.x, z.y, '#ff4400', Math.min(10, 2 + stackCount), particleSize, 0.5);
          }
          
          // 大于5层时传染给周围怪物
          if (stackCount > 5) {
            for (const z2 of zombies) {
              if (z2 === z || z2.isInvulnerable) continue;
              const tdx = z2.x - z.x, tdy = z2.y - z.y;
              if (tdx * tdx + tdy * tdy < 80 * 80) {
                z2.burnStacks = (z2.burnStacks || 0) + 1;
              }
            }
          }
        }
      }
    }
  }
}

// ============================================================
// UPDATE
// ============================================================
let spawnTimer = 0;
let spawnInterval = 1.5;
let difficulty = 0;
let regenTimer = 0;
let victory = false;
let screenShake = { intensity: 0, duration: 0 };

function addScreenShake(intensity, duration) {
  screenShake.intensity = Math.max(screenShake.intensity, intensity);
  screenShake.duration = Math.max(screenShake.duration, duration);
}

function update(dt) {
  if (!player || !gameRunning || gamePaused) return;

  gameTime += dt;
  difficulty = gameTime;

  // Update screen shake
  if (screenShake.duration > 0) {
    screenShake.duration -= dt;
    if (screenShake.duration <= 0) {
      screenShake.intensity = 0;
      screenShake.duration = 0;
    } else {
      screenShake.intensity *= 0.9;
    }
  }

  // --- Wave System ---
  const currentWave = getWaveForTime(gameTime);
  if (currentWave > waveState.currentWave) {
    waveState.currentWave = currentWave;
    const bossInWave = currentWave % BOSS_DEFS.length;
    const def = BOSS_DEFS[bossInWave];
    const round = Math.floor(currentWave / BOSS_DEFS.length);
    waveState.waveAnnounceTimer = 4;
    waveState.waveAnnounceText = round > 0 ? `第${round+1}轮 - ${def.name}` : `${def.title}: ${def.name}`;
    waveState.pendingBossWave = currentWave;
    waveState.pendingBossTimer = 2;
  }

  if (waveState.waveAnnounceTimer > 0) waveState.waveAnnounceTimer -= dt;

  if (waveState.pendingBossWave >= 0) {
    waveState.pendingBossTimer -= dt;
    if (waveState.pendingBossTimer <= 0) {
      spawnWaveBoss(waveState.pendingBossWave);
      waveState.pendingBossWave = -1;
      waveState.pendingBossTimer = 0;
    }
  }

  // Check victory
  if (gameTime >= GAME_DURATION && !victory) {
    victory = true;
    gameRunning = false;
    AudioSys.stopBgm();
    showGameOver(true);
    return;
  }

  // --- Player Movement ---
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'] || keys['ArrowUp']) dy -= 1;
  if (keys['s'] || keys['arrowdown'] || keys['ArrowDown']) dy += 1;
  if (keys['a'] || keys['arrowleft'] || keys['ArrowLeft']) dx -= 1;
  if (keys['d'] || keys['arrowright'] || keys['ArrowRight']) dx += 1;

  if (joystick.active && (joystick.inputX !== 0 || joystick.inputY !== 0)) {
    dx = joystick.inputX;
    dy = joystick.inputY;
  }

  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    const spd = (player.speed + player.speedBonus) * (1 + (player.passives.speed || 0) * 0.1);
    player.x += (dx / len) * spd * dt;
    player.y += (dy / len) * spd * dt;
  }
  player.x = clamp(player.x, player.radius, WORLD_W - player.radius);
  player.y = clamp(player.y, player.radius, WORLD_H - player.radius);

  if (player.invTimer > 0) player.invTimer -= dt;
  if (player.damageFlash > 0) player.damageFlash -= dt;

  // Mechanist armor timer: +1 armor every 3 seconds
  if (player.classId === 'mechanist') {
    player.armorTimer = (player.armorTimer || 0) + dt;
    if (player.armorTimer >= 3) {
      player.armor += 1;
      player.armorTimer = 0;
    }
  }

  // Regen
  regenTimer += dt;
  if (regenTimer >= 1) {
    regenTimer -= 1;
    if (player.passives.regen > 0) {
      player.hp = Math.min(player.maxHp, player.hp + player.passives.regen);
    }
  }

  player.maxHp = 100 + (player.passives.hp_up || 0) * 20 + (player.maxHpBonus || 0);

  // --- Camera ---
  camera.x = lerp(camera.x, player.x, 8 * dt);
  camera.y = lerp(camera.y, player.y, 8 * dt);

  // --- Zombie Spawning ---
  const bossActive = waveState.bossAlive;
  const spawnMult = bossActive ? 0.3 : 1;
  const spawnRate = Math.max(0.15, (1.5 - difficulty * 0.015) / spawnMult);
  const maxZombies = Math.min(500, (30 + Math.floor(difficulty * 0.8)) * (bossActive ? 0.5 : 1));
  spawnTimer += dt;
  if (spawnTimer >= spawnRate && zombies.length < maxZombies) {
    spawnTimer = 0;
    const count = 1 + Math.floor(difficulty / 60);
    for (let i = 0; i < count && zombies.length < maxZombies; i++) {
      spawnZombie(difficulty);
    }
  }

  // --- Update Frost Trails / Bleed Trails ---
  for (let i = frostTrails.length - 1; i >= 0; i--) {
    const ft = frostTrails[i];
    ft.life -= dt;
    if (ft.life <= 0) {
      frostTrails.splice(i, 1);
      continue;
    }
    if (ft.isBleed && ft.damage) {
      ft.tickTimer += dt;
      if (ft.tickTimer >= 0.5) {
        ft.tickTimer -= 0.5;
        for (const z of zombies) {
          if (dist(ft, z) < ft.radius + z.radius) {
            z.hp -= ft.damage * 0.5;
            applyDebuff(z, 'bleed', 0.3);
          }
        }
      }
    } else {
      for (const z of zombies) {
        if (dist(ft, z) < ft.radius + z.radius) {
          z.slowTimer = 1;
          z.slowFactor = ft.slowFactor;
        }
      }
    }
  }

  // --- Update Poison Clouds ---
  for (let i = poisonClouds.length - 1; i >= 0; i--) {
    const c = poisonClouds[i];
    c.life -= dt;
    if (c.life <= 0) {
      poisonClouds.splice(i, 1);
      continue;
    }
    c.tickTimer += dt;
    if (c.tickTimer >= 0.5) {
      c.tickTimer -= 0.5;
      for (const z of zombies) {
        if (dist(c, z) < c.radius + z.radius) {
          z.hp -= c.damage;
          applyDebuff(z, 'poison', 1);
        }
      }
    }
  }

  // --- Update Zombies ---
  for (let i = 0; i < zombies.length; i++) {
    const zi = zombies[i];
    let sepX = 0, sepY = 0;
    for (let j = Math.max(0, i - 10); j < Math.min(zombies.length, i + 10); j++) {
      if (i === j) continue;
      const zj = zombies[j];
      const d = dist(zi, zj);
      const minDist = zi.radius + zj.radius;
      if (d < minDist && d > 0.1) {
        const push = (minDist - d) / d * 0.3;
        sepX += (zi.x - zj.x) * push;
        sepY += (zi.y - zj.y) * push;
      }
    }
    zi.x += sepX;
    zi.y += sepY;
  }

  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i];

    // Death check at the beginning of loop
    if (z.hp <= 0) {
      z.hp = 0;
      killCount++;
      AudioSys.kill();
      spawnParticles(z.x, z.y, z.type === 'tank' ? COLORS.zombieTank : z.type === 'fast' ? COLORS.zombieFast : '#2ecc71', 8, 120, 0.5);
      if (player.level >= 70) { zombies.splice(i, 1); continue; }
      const gemCount = z.type === 'tank' ? 3 : 1;
      for (let g = 0; g < gemCount; g++) {
        gems.push({
          x: z.x + rand(-20, 20), y: z.y + rand(-20, 20),
          value: z.xpValue, radius: z.type === 'tank' ? 6 : 5,
          color: COLORS.gem[randInt(0, COLORS.gem.length - 1)],
          magnetized: false,
        });
      }
      tryDropXpMagnetGem(z.x, z.y);
      zombies.splice(i, 1);
      continue;
    }

    // Update debuffs
    updateDebuffs(z, dt);

    // Stun check
    if (z.stunTimer && z.stunTimer > 0) {
      z.stunTimer -= dt;
      continue;
    }

    // Frozen check
    if (z.chillFrozenTimer > 0) {
      z.chillFrozenTimer -= dt;
      if (z.hitFlash > 0) z.hitFlash -= dt;
      if (z.burnTimer > 0) {
        z.burnTimer -= dt;
        z.hp -= z.burnDamage * dt;
      }
      continue; // Skip movement when frozen
    }

    // Slow timer decay
    if (z.slowTimer > 0) {
      z.slowTimer -= dt;
      if (z.slowTimer <= 0) z.slowFactor = 1;
    }

    // Calculate speed with debuffs
    let spd = z.speed * z.slowFactor;
    if (z.debuffs.slow > 0) {
      spd *= (1 - z.debuffs.slow);
    }

    const a = angle(z, player);
    z.x += Math.cos(a) * spd * dt;
    z.y += Math.sin(a) * spd * dt;

    // Zombie-zombie collision push
    if (zombies.length < 200) {
      for (let j = 0; j < zombies.length; j++) {
        if (i === j) continue;
        const oz = zombies[j];
        const ddx = z.x - oz.x;
        const ddy = z.y - oz.y;
        const dd = Math.sqrt(ddx * ddx + ddy * ddy);
        const minDist = z.radius + oz.radius;
        if (dd < minDist && dd > 0.01) {
          const push = (minDist - dd) * 0.5;
          const nx = ddx / dd;
          const ny = ddy / dd;
          z.x += nx * push;
          z.y += ny * push;
          oz.x -= nx * push;
          oz.y -= ny * push;
        }
      }
    }
    // Zombie-player collision push (only push zombie, not player)
    const pdx = z.x - player.x;
    const pdy = z.y - player.y;
    const pd = Math.sqrt(pdx * pdx + pdy * pdy);
    const pMinDist = z.radius + player.radius;
    if (pd < pMinDist && pd > 0.01) {
      const push = pMinDist - pd;
      z.x += (pdx / pd) * push;
      z.y += (pdy / pd) * push;
    }
    // Clamp to world bounds
    z.x = clamp(z.x, z.radius, WORLD_W - z.radius);
    z.y = clamp(z.y, z.radius, WORLD_H - z.radius);

    if (z.hitFlash > 0) z.hitFlash -= dt;

    if (z.burnTimer > 0) {
      z.burnTimer -= dt;
      z.hp -= z.burnDamage * dt;
      if (Math.random() < 0.1) {
        spawnParticles(z.x + rand(-z.radius, z.radius), z.y + rand(-z.radius, z.radius), '#ff6600', 1, 40, 0.3);
      }
    }

    if (dist(z, player) < z.radius + player.radius && player.invTimer <= 0) {
      const dmg = Math.max(1, z.damage - player.armor - (player.passives.armor || 0) * 3);
      player.hp -= dmg;
      if (!AudioSys._lastHurt || gameTime - AudioSys._lastHurt > 0.15) { AudioSys.hurt(); AudioSys._lastHurt = gameTime; }
      player.invTimer = 0.5;
      player.damageFlash = 0.2;
      spawnDamageNumber(player.x, player.y, dmg, COLORS.damage);
      spawnParticles(player.x, player.y, COLORS.damage, 5, 100, 0.3);
      addScreenShake(5, 0.2);
      const ka = angle(player, z);
      z.x += Math.cos(ka) * 20;
      z.y += Math.sin(ka) * 20;
    }
  }

  // --- Update Boss ---
  updateBoss(dt);
  updateBossProjectiles(dt);
  updateBossZones(dt);

  // --- Update Summon Weapons ---
  updateSummonWeapons(dt);

  // --- Update Passive Auras ---
  updatePassiveAuras(dt);

  // --- Update Weapons ---
  for (const w of player.weapons) {
    fireWeapon(w, dt);
  }

  // --- Update Projectiles ---
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    const moveX = p.vx * dt;
    const moveY = p.vy * dt;
    p.x += moveX;
    p.y += moveY;
    p.traveled += Math.hypot(moveX, moveY);

    if (p.traveled > p.range || p.x < 0 || p.x > WORLD_W || p.y < 0 || p.y > WORLD_H) {
      projectiles.splice(i, 1);
      continue;
    }

    let hit = false;
    const allTargets = waveState.boss && waveState.bossAlive ? [...zombies, waveState.boss] : zombies;
    for (const z of allTargets) {
      if (dist(p, z) < p.radius + z.radius) {
        if (z.isInvulnerable) continue;
        z.hp -= p.damage;
        z.hitFlash = 0.1;
        if (!z.lastHitSound || gameTime - z.lastHitSound > 0.1) { AudioSys.hit(); z.lastHitSound = gameTime; }
        spawnDamageNumber(z.x, z.y, p.damage, COLORS.damage);
        spawnParticles(p.x, p.y, COLORS.bullet, 2, 60, 0.2);

        // Explosive bullets
        if (p.isExplosive) {
          const aoeR = 60;
          spawnParticles(p.x, p.y, '#ff4400', 15, 150, 0.5);
          lightnings.push({ x1: p.x, y1: p.y, x2: p.x + aoeR, y2: p.y, life: 0.3, isExplosion: true, radius: aoeR, color: '#ff6600' });
          for (const z2 of allTargets) {
            if (z2 === z) continue;
            if (dist(p, z2) < aoeR + z2.radius) {
              z2.hp -= p.damage * 0.5;
              z2.hitFlash = 0.1;
              spawnDamageNumber(z2.x, z2.y, p.damage * 0.5, '#ff6600');
            }
          }
        }

        // Chain lightning
        if (p.chainLightning && p.chainLightning > 0) {
          let chainSource = z;
          let remaining = p.chainLightning;
          const chainRange = 100;
          const chainDmg = p.damage * 0.4;
          const hitSet = new Set([z]);
          while (remaining > 0) {
            let nearest = null, nearDist = chainRange;
            for (const z2 of allTargets) {
              if (hitSet.has(z2)) continue;
              const d = dist(chainSource, z2);
              if (d < nearDist) { nearDist = d; nearest = z2; }
            }
            if (!nearest) break;
            hitSet.add(nearest);
            nearest.hp -= chainDmg;
            nearest.hitFlash = 0.1;
            spawnDamageNumber(nearest.x, nearest.y, chainDmg, '#00ffff');
            lightnings.push({ x1: chainSource.x, y1: chainSource.y, x2: nearest.x, y2: nearest.y, life: 0.15 });
            spawnParticles(nearest.x, nearest.y, '#00ffff', 2, 50, 0.2);
            chainSource = nearest;
            remaining--;
          }
        }

        // Poison shot AOE damage + AOE poison debuff
        if (p.aoePoison && p.aoeRadius) {
          const aoeR = Math.max(0.1, p.aoeRadius);
          for (const z2 of allTargets) {
            if (z2 === z) continue;
            if (dist(p, z2) < aoeR + z2.radius) {
              z2.hp -= p.damage * 0.3;
              z2.hitFlash = 0.1;
              spawnDamageNumber(z2.x, z2.y, p.damage * 0.3, '#44ff44');
              applyDebuff(z2, 'poison', 1);
            }
          }
          // Epic: spawn poison cloud at hit location
          if (p.isEpic) {
            poisonClouds.push({
              x: p.x, y: p.y,
              radius: 60, damage: 5,
              life: 3, maxLife: 3,
              color: 'rgba(0,255,68,0.25)',
              borderColor: '#44ff44',
              tickTimer: 0,
            });
          }
          spawnParticles(p.x, p.y, '#44ff44', 10, 80, 0.4);
        }

        // Split on hit (split_gun, freeze_gun)
        if (p.splitOnHit) {
          const sc = p.splitCount || 3;
          for (let si = 0; si < sc; si++) {
            const sa = rand(0, Math.PI * 2);
            const subDmg = p.damage * 0.4;
            const subRange = p.splitRange || 250;
            const sub = {
              x: p.x, y: p.y,
              vx: Math.cos(sa) * 300,
              vy: Math.sin(sa) * 300,
              damage: subDmg,
              radius: 3,
              range: subRange, traveled: 0,
              pierce: 0,
              color: p.color,
              isExplosive: false,
              chainLightning: 0,
              weaponId: p.weaponId,
            };
            // Freeze gun: apply chill on split projectiles too
            if (p.freezeOnHit) {
              sub.freezeOnHit = true;
              sub.freezeStacks = p.freezeStacks || 1;
            }
            // Epic secondary split: sub projectiles can split again into 5
            if (p.splitCanSplit && !p._hasSubSplit && p.epicSplitCount > 0) {
              sub.splitOnHit = true;
              sub.splitCount = p.epicSplitCount;
              sub.splitCanSplit = false;
              sub._hasSubSplit = true;
              sub.splitRange = subRange;
              sub.weaponId = p.weaponId;
            }
            projectiles.push(sub);
          }
          // Apply debuffs on main hit
          if (p.freezeOnHit) {
            applyDebuff(z, 'chill', p.freezeStacks || 1);
          }
        }

        // Poison on hit
        if (p.poisonOnHit && z.hp > 0) {
          applyDebuff(z, 'poison', p.poisonStacks || 1);
        }
        if (p.createPoisonCloud && z.hp > 0) {
          // 创建毒气云
          poisonClouds.push({
            x: z.x, y: z.y,
            radius: 60, damage: p.damage * 0.3,
            life: 5, maxLife: 5,
            color: 'rgba(0,255,68,0.25)',
            borderColor: '#44ff44',
            tickTimer: 0,
          });
        }

        if (p.pierce > 0) {
          p.pierce--;
        } else {
          hit = true;
        }
        break;
      }
    }
    if (hit) projectiles.splice(i, 1);
  }

  // --- Update Flames ---
  for (let i = flames.length - 1; i >= 0; i--) {
    const f = flames[i];
    f.life -= dt;
    if (f.life <= 0) { flames.splice(i, 1); continue; }

    if (f.isTornado) {
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      const tornadoTrackSpeed = f.isLv8Tornado ? 240 : 120;
      const target = findNearestZombie(f.x, f.y, 200, 1);
      if (target) {
        const ta = angle(f, target);
        f.vx = lerp(f.vx, Math.cos(ta) * tornadoTrackSpeed, 3 * dt);
        f.vy = lerp(f.vy, Math.sin(ta) * tornadoTrackSpeed, 3 * dt);
      }
      f.burnGroundTimer += dt;
      if (f.burnGroundTimer >= 0.3) {
        f.burnGroundTimer -= 0.3;
        bossZones.push({
          x: f.x, y: f.y,
          radius: 20,
          damage: f.damage,
          life: 8, maxLife: 8,
          color: 'rgba(255,100,0,0.2)',
          borderColor: '#ff4400',
          type: 'fire',
          tickTimer: 0,
        });
      }
      const allTargets = waveState.boss && waveState.bossAlive ? [...zombies, waveState.boss] : zombies;
      for (const z of allTargets) {
        if (z.isInvulnerable) continue;
        if (dist(f, z) < f.radius + z.radius) {
          z.hp -= f.damage;
          z.hitFlash = 0.05;
          z.burnTimer = 1.5;
          z.burnDamage = f.damage * 3;
        }
      }
      if (Math.random() < 0.5) {
        spawnParticles(f.x + rand(-f.radius, f.radius), f.y + rand(-f.radius, f.radius), '#ff6600', 1, 40, 0.3);
      }
    } else {
      const allTargets = waveState.boss && waveState.bossAlive ? [...zombies, waveState.boss] : zombies;
      for (const z of allTargets) {
        if (z.isInvulnerable) continue;
        if (dist(f, z) < f.radius + z.radius) {
          z.hp -= f.damage;
          z.hitFlash = 0.05;
          z.burnTimer = 1.5;
          z.burnDamage = f.damage * 3;
        }
      }
    }
  }

  // --- Update Lightnings ---
  for (let i = lightnings.length - 1; i >= 0; i--) {
    lightnings[i].life -= dt;
    if (lightnings[i].life <= 0) lightnings.splice(i, 1);
  }

  // --- Pickup Gems ---
  const pickupRange = player.pickupRange;
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    const d = dist(player, g);
    if (d < pickupRange || g.magnetized) {
      g.magnetized = true;
      const a = angle(g, player);
      g.x += Math.cos(a) * 400 * dt;
      g.y += Math.sin(a) * 400 * dt;
    }
    if (d < player.radius + g.radius) {
      player.xp += Math.round(g.value * player.xpMultiplier * (1 + (player.passives.xp_boost || 0) * 0.2));
      AudioSys.pickup();
      gems.splice(i, 1);
      while (player.xp >= player.xpToNext) {
        player.xp -= player.xpToNext;
        player.level++;
        player.xpToNext = player.level <= 30
          ? Math.floor(10 * Math.pow(1.15, player.level - 1))
          : Math.floor(8 * Math.pow(1.12, player.level - 1));
        showLevelUpScreen();
        // 70级后清空经验球和磁铁道具
        if (player.level >= 70) {
          gems.length = 0;
          xpMagnetGems.length = 0;
        }
      }
    }
  }

  // --- Pickup XP Magnet Gems ---
  for (let i = xpMagnetGems.length - 1; i >= 0; i--) {
    const mg = xpMagnetGems[i];
    mg.glowTimer += dt;
    const d = dist(player, mg);
    if (d < player.radius + mg.radius + 10) {
      pickupXpMagnetGem(mg, i);
      xpMagnetGems.splice(i, 1);
    }
  }

  // --- Update Big Announcements ---
  for (let i = bigAnnouncements.length - 1; i >= 0; i--) {
    bigAnnouncements[i].life -= dt;
    if (bigAnnouncements[i].life <= 0) bigAnnouncements.splice(i, 1);
  }

  // --- Update Particles ---
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // --- Update Damage Numbers ---
  for (let i = damageNumbers.length - 1; i >= 0; i--) {
    const d = damageNumbers[i];
    d.y += d.vy * dt; d.vy *= 0.95;
    d.life -= dt;
    if (d.life <= 0) damageNumbers.splice(i, 1);
  }

  // --- Check Player Death ---
  if (player.hp <= 0) {
    if (gameMode === 'multi') broadcastPlayerDeath();
    gameRunning = false;
    AudioSys.stopBgm();
    showGameOver(false);
  }

  // --- Multiplayer Broadcast ---
  if (gameMode === 'multi') {
    mpInputTimer -= dt;
    if (mpInputTimer <= 0) {
      mpInputTimer = 0.1; // 10Hz广播
      broadcastPlayerState();
    }
    // 插值其他玩家位置
    for (const pid in mpLerpPlayers) {
      const lp = mpLerpPlayers[pid];
      if (lp.x !== undefined && lp.tx !== undefined) {
        lp.x += (lp.tx - lp.x) * 0.15;
        lp.y += (lp.ty - lp.y) * 0.15;
      }
    }
    // 不return，继续执行本地刷怪/伤害逻辑
  }
}

// ============================================================
// RENDER
// ============================================================
function render() {
  if (!gameRunning || !player) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    return;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let shakeX = 0, shakeY = 0;
  if (screenShake.duration > 0) {
    shakeX = rand(-screenShake.intensity, screenShake.intensity);
    shakeY = rand(-screenShake.intensity, screenShake.intensity);
  }

  const ox = canvas.width / 2 - camera.x + shakeX;
  const oy = canvas.height / 2 - camera.y + shakeY;

  ctx.save();
  ctx.translate(ox, oy);

  // --- Ground Grid ---
  const gridSize = 80;
  const startGX = Math.floor((camera.x - canvas.width / 2) / gridSize) * gridSize;
  const startGY = Math.floor((camera.y - canvas.height / 2) / gridSize) * gridSize;
  ctx.fillStyle = COLORS.ground;
  ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 1;
  for (let x = startGX; x < camera.x + canvas.width / 2 + gridSize; x += gridSize) {
    if (x < 0 || x > WORLD_W) continue;
    ctx.beginPath(); ctx.moveTo(x, Math.max(0, startGY)); ctx.lineTo(x, Math.min(WORLD_H, camera.y + canvas.height / 2 + gridSize)); ctx.stroke();
  }
  for (let y = startGY; y < camera.y + canvas.height / 2 + gridSize; y += gridSize) {
    if (y < 0 || y > WORLD_H) continue;
    ctx.beginPath(); ctx.moveTo(Math.max(0, startGX), y); ctx.lineTo(Math.min(WORLD_W, camera.x + canvas.width / 2 + gridSize), y); ctx.stroke();
  }
  ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 3; ctx.strokeRect(0, 0, WORLD_W, WORLD_H);

  // --- Boss Zones ---
  for (const z of bossZones) {
    const alpha = Math.min(1, z.life / (z.maxLife * 0.3));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = z.color;
    ctx.beginPath();
    ctx.arc(z.x, z.y, Math.max(0.1, z.radius), 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = z.borderColor;
    ctx.lineWidth = 2;
    ctx.globalAlpha = alpha * 0.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // --- Poison Clouds ---
  for (const c of poisonClouds) {
    const alpha = Math.min(1, c.life / (c.maxLife * 0.3));
    ctx.globalAlpha = alpha * 0.4;
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.arc(c.x, c.y, Math.max(0.1, c.radius), 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = c.borderColor;
    ctx.lineWidth = 2;
    ctx.globalAlpha = alpha * 0.3;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // --- Frost Trails ---
  for (const ft of frostTrails) {
    const alpha = ft.life / ft.maxLife * 0.4;
    ctx.globalAlpha = alpha;
    if (ft.isBleed) {
      ctx.fillStyle = '#ff4444';
    } else {
      ctx.fillStyle = '#88ccff';
    }
    ctx.beginPath();
    ctx.arc(ft.x, ft.y, Math.max(0.1, ft.radius), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // --- Gems ---
  for (const g of gems) {
    ctx.fillStyle = g.color;
    ctx.globalAlpha = 0.7 + Math.sin(gameTime * 5 + g.x) * 0.3;
    ctx.beginPath();
    ctx.moveTo(g.x, g.y - g.radius);
    ctx.lineTo(g.x + g.radius * 0.7, g.y);
    ctx.lineTo(g.x, g.y + g.radius);
    ctx.lineTo(g.x - g.radius * 0.7, g.y);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // --- XP Magnet Gems ---
  for (const mg of xpMagnetGems) {
    const pulse = 1 + Math.sin(mg.glowTimer * 6) * 0.3;
    ctx.save();
    ctx.translate(mg.x, mg.y);
    ctx.scale(pulse, pulse);
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    const r = mg.radius;
    for (let j = 0; j < 5; j++) {
      const a1 = (Math.PI * 2 / 5) * j - Math.PI / 2;
      const a2 = a1 + Math.PI / 5;
      if (j === 0) ctx.moveTo(Math.cos(a1) * r, Math.sin(a1) * r);
      else ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
      ctx.lineTo(Math.cos(a2) * r * 0.4, Math.sin(a2) * r * 0.4);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(0.1, r * 0.3), 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // --- Passive Aura Visuals ---
  for (const w of player.weapons) {
    const def = WEAPON_DEFS[w.defId];
    if (!def || def.type !== 'aura') continue;
    const isEpic = w.level >= MAX_WEAPON_LEVEL;
    let range = def.range;
    if (def.debuffType === 'radiation') range = isEpic ? 1000 : def.range + w.level * 30;
    else if (def.debuffType === 'em_slow') range = isEpic ? 150 : def.range + w.level * 50;
    else if (def.debuffType === 'toxic_aura') range = isEpic ? 120 : def.range + w.level * 50;
    ctx.globalAlpha = 0.12 + Math.sin(gameTime * 3) * 0.05;
    if (def.debuffType === 'radiation') { ctx.fillStyle = '#aaff00'; ctx.strokeStyle = '#88cc00'; }
    else if (def.debuffType === 'em_slow') { ctx.fillStyle = '#8844ff'; ctx.strokeStyle = '#6622cc'; }
    else if (def.debuffType === 'toxic_aura') { ctx.fillStyle = '#00cc44'; ctx.strokeStyle = '#009933'; }
    else if (def.debuffType === 'burn') { ctx.fillStyle = '#ff4400'; ctx.strokeStyle = '#cc3300'; }
    ctx.beginPath(); ctx.arc(player.x, player.y, Math.max(0.1, range), 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2; ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // --- Flames ---
  for (const f of flames) {
    if (f.isTornado) {
      const alpha = f.life / f.maxLife;
      ctx.globalAlpha = alpha * 0.7;
      ctx.fillStyle = '#ff2200';
      ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(0.1, f.radius * 1.2), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff6600';
      ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(0.1, f.radius * 0.6), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(0.1, f.radius * 0.3), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      const alpha = f.life / f.maxLife;
      ctx.globalAlpha = alpha * 0.6;
      ctx.fillStyle = '#ff6600';
      ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(0.1, f.radius * (1 + (1 - alpha) * 0.5)), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(0.1, f.radius * 0.6 * (1 + (1 - alpha) * 0.3)), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // --- Projectiles ---
  for (const p of projectiles) {
    ctx.fillStyle = p.isExplosive ? '#ff6600' : (p.color || COLORS.bullet);
    ctx.shadowColor = p.isExplosive ? '#ff4400' : COLORS.bulletGlow;
    ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.1, p.radius), 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // --- Summon Projectiles ---
  for (const sp of summonProjectiles) {
    ctx.fillStyle = sp.color;
    ctx.shadowColor = sp.color;
    ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, Math.max(0.1, sp.radius), 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // --- Boss Projectiles ---
  for (const p of bossProjectiles) {
    if (p.type === 'ray') {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.rayWidth;
      ctx.globalAlpha = Math.min(1, p.life) * 0.6;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.moveTo(p.sourceX, p.sourceY);
      ctx.lineTo(p.sourceX + Math.cos(p.rayAngle) * 600, p.sourceY + Math.sin(p.rayAngle) * 600);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.1, p.radius), 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  // --- Summon Entities ---
  for (const s of summons) {
    ctx.save();
    ctx.translate(s.x, s.y);

    if (s.summonType === 'drone') {
      ctx.fillStyle = s.epic ? '#00ddff' : '#4488aa';
      ctx.shadowColor = s.epic ? '#00ffff' : '#336688';
      ctx.shadowBlur = s.epic ? 12 : 5;
      ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, s.radius), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, -s.radius * 0.3, Math.max(0.1, s.radius * 0.3), 0, Math.PI * 2); ctx.fill();
      if (s.epic) {
        ctx.globalAlpha = 0.2;
        ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, s.radius + 6), 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.shadowBlur = 0;
    } else if (s.summonType === 'disc_blade') {
      ctx.fillStyle = s.epic ? '#ff8844' : '#aaa';
      ctx.shadowColor = s.epic ? '#ff4400' : '#666';
      ctx.shadowBlur = s.epic ? 12 : 4;
      const spinAngle = gameTime * (s.speed || 3) * 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, Math.max(0.1, s.radius), Math.max(0.1, s.radius * 0.4), spinAngle, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      if (s.epic) {
        ctx.globalAlpha = 0.3; ctx.fillStyle = '#ff4400';
        ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, s.radius * 0.5), 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    } else if (s.summonType === 'auto_turret') {
      // 炮台底座
      ctx.fillStyle = s.epic ? '#4488ff' : '#666';
      ctx.shadowColor = s.epic ? '#0088ff' : '#444';
      ctx.shadowBlur = s.epic ? 10 : 3;
      ctx.fillRect(-s.radius, -s.radius, s.radius * 2, s.radius * 2);
      // 枪管指向目标
      const ca = s.laserTarget ? angle(s, s.laserTarget) : 0;
      ctx.save();
      ctx.rotate(ca);
      ctx.fillStyle = s.epic ? '#ff4444' : '#888';
      ctx.fillRect(0, -3, s.radius * 2, 6);
      ctx.restore();
      // HP bar
      if (s.hp < s.maxHp) {
        const barW = s.radius * 2;
        ctx.fillStyle = '#333'; ctx.fillRect(-barW / 2, -s.radius - 8, barW, 3);
        ctx.fillStyle = '#2ecc71'; ctx.fillRect(-barW / 2, -s.radius - 8, barW * (s.hp / s.maxHp), 3);
      }
      if (s.epic) {
        ctx.globalAlpha = 0.15 + Math.sin(gameTime * 3) * 0.1;
        ctx.strokeStyle = '#00aaff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, 100), 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.shadowBlur = 0;
    } else if (s.summonType === 'mech_beast') {
      ctx.fillStyle = s.epic ? '#ff8800' : '#886644';
      ctx.shadowColor = s.epic ? '#ff4400' : '#553322';
      ctx.shadowBlur = s.epic ? 10 : 4;
      ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, s.radius), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff4444';
      const eyeOff = s.radius * 0.3;
      ctx.beginPath(); ctx.arc(-eyeOff, -eyeOff * 0.5, Math.max(0.1, 3), 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(eyeOff, -eyeOff * 0.5, Math.max(0.1, 3), 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      if (s.epic) {
        ctx.globalAlpha = 0.2; ctx.fillStyle = '#ff0000';
        ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, s.radius + 5), 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    } else if (s.summonType === 'mech_warrior') {
      const mwColor = s.epic ? '#ffaa00' : '#777';
      ctx.fillStyle = mwColor;
      ctx.shadowColor = s.epic ? '#ff8800' : '#555';
      ctx.shadowBlur = s.epic ? 10 : 4;
      // Square body (rounded rect)
      const bw = s.radius * 1.6, bh = s.radius * 1.8;
      const br = 3;
      ctx.beginPath();
      ctx.moveTo(-bw / 2 + br, -bh / 2);
      ctx.lineTo(bw / 2 - br, -bh / 2);
      ctx.quadraticCurveTo(bw / 2, -bh / 2, bw / 2, -bh / 2 + br);
      ctx.lineTo(bw / 2, bh / 2 - br);
      ctx.quadraticCurveTo(bw / 2, bh / 2, bw / 2 - br, bh / 2);
      ctx.lineTo(-bw / 2 + br, bh / 2);
      ctx.quadraticCurveTo(-bw / 2, bh / 2, -bw / 2, bh / 2 - br);
      ctx.lineTo(-bw / 2, -bh / 2 + br);
      ctx.quadraticCurveTo(-bw / 2, -bh / 2, -bw / 2 + br, -bh / 2);
      ctx.closePath();
      ctx.fill();
      // Triangle head
      ctx.beginPath();
      ctx.moveTo(0, -bh / 2 - s.radius * 0.8);
      ctx.lineTo(-s.radius * 0.5, -bh / 2);
      ctx.lineTo(s.radius * 0.5, -bh / 2);
      ctx.closePath();
      ctx.fill();
      // Shoulder armor (left)
      ctx.fillRect(-bw / 2 - 4, -bh / 2 + 2, 6, bh * 0.4);
      // Shoulder armor (right)
      ctx.fillRect(bw / 2 - 2, -bh / 2 + 2, 6, bh * 0.4);
      // Eyes
      ctx.fillStyle = '#ff0000';
      ctx.beginPath();
      ctx.arc(-3, -bh / 2 - s.radius * 0.35, 2, 0, Math.PI * 2);
      ctx.arc(3, -bh / 2 - s.radius * 0.35, 2, 0, Math.PI * 2);
      ctx.fill();
      if (s.hp < s.maxHp) {
        const barW = s.radius * 2;
        ctx.fillStyle = '#333'; ctx.fillRect(-barW / 2, -s.radius - 12, barW, 3);
        ctx.fillStyle = '#ffaa00'; ctx.fillRect(-barW / 2, -s.radius - 12, barW * (s.hp / s.maxHp), 3);
      }
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  // --- Zombies ---
  for (const z of zombies) {
    ctx.save();
    ctx.translate(z.x, z.y);
    let bodyColor;
    switch (z.type) {
      case 'fast': bodyColor = COLORS.zombieFast; break;
      case 'tank': bodyColor = COLORS.zombieTank; break;
      default: bodyColor = COLORS.zombie[z.colorIndex || 0]; break;
    }
    if (z.hitFlash > 0) bodyColor = '#fff';
    if (z.burnTimer > 0 && z.hitFlash <= 0) bodyColor = '#ff6600';
    if (z.slowTimer > 0 && z.hitFlash <= 0 && z.burnTimer <= 0) bodyColor = '#88ccff';
    if (z.hitFlash <= 0 && z.burnTimer <= 0 && z.slowTimer <= 0) {
      if (z.debuffs && z.debuffs.chill >= 3) bodyColor = '#88ccff';
      if (z.debuffs && z.debuffs.poison >= 3) bodyColor = '#44cc44';
      if (z.debuffs && z.debuffs.bleed >= 2) bodyColor = '#cc4444';
      if (z.debuffs && z.debuffs.slow > 0) bodyColor = '#aa66cc';
      if (z.chillFrozenTimer > 0) bodyColor = '#aaddff';
    }
    ctx.fillStyle = bodyColor;
    ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, z.radius), 0, Math.PI * 2); ctx.fill();
    const eyeOff = z.radius * 0.35;
    const eyeR = Math.max(0.1, z.radius * 0.2);
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.arc(-eyeOff, -eyeOff * 0.5, eyeR, 0, Math.PI * 2);
    ctx.arc(eyeOff, -eyeOff * 0.5, eyeR, 0, Math.PI * 2);
    ctx.fill();
    if (z.stunTimer && z.stunTimer > 0) {
      ctx.fillStyle = '#ffff00'; ctx.font = `bold ${z.radius}px sans-serif`; ctx.textAlign = 'center';
      ctx.fillText('★', 0, -z.radius - 5);
    }
    if (z.chillFrozenTimer > 0) {
      ctx.fillStyle = '#88ccff'; ctx.font = `bold ${z.radius * 0.8}px sans-serif`; ctx.textAlign = 'center';
      ctx.fillText('❄', 0, -z.radius - 5);
    }
    const a = angle(z, player);
    ctx.strokeStyle = bodyColor; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a + 0.8) * z.radius, Math.sin(a + 0.8) * z.radius);
    ctx.lineTo(Math.cos(a + 0.4) * (z.radius + 12), Math.sin(a + 0.4) * (z.radius + 12));
    ctx.moveTo(Math.cos(a - 0.8) * z.radius, Math.sin(a - 0.8) * z.radius);
    ctx.lineTo(Math.cos(a - 0.4) * (z.radius + 12), Math.sin(a - 0.4) * (z.radius + 12));
    ctx.stroke();
    if (z.type === 'tank') {
      const barW = z.radius * 2; const barH = 4; const barY = -z.radius - 10;
      ctx.fillStyle = '#333'; ctx.fillRect(-barW / 2, barY, barW, barH);
      ctx.fillStyle = '#9b59b6'; ctx.fillRect(-barW / 2, barY, barW * (z.hp / z.maxHp), barH);
    }
    // Debuff icons + stack count above HP bar
    if (z.debuffs) {
      const dbArr = [];
      if (z.debuffs.chill > 0) dbArr.push({ icon: '\u2744\uFE0F', stacks: z.debuffs.chill });
      if (z.debuffs.poison > 0) dbArr.push({ icon: '\u2620\uFE0F', stacks: z.debuffs.poison });
      if (z.debuffs.bleed > 0) dbArr.push({ icon: '\uD83E\uDE78', stacks: z.debuffs.bleed });
      if (z.debuffs.slow > 0) dbArr.push({ icon: '\uD83D\uDC0C', stacks: Math.ceil(z.debuffs.slow * 10) / 10 });
      if (dbArr.length > 0) {
        const iconSize = 10;
        const totalW = dbArr.length * (iconSize + 4);
        const startX = -totalW / 2;
        const startY = -z.radius - (z.type === 'tank' ? 20 : 12);
        for (let di = 0; di < dbArr.length; di++) {
          const dx2 = startX + di * (iconSize + 4);
          ctx.font = `${iconSize}px sans-serif`;
          ctx.textAlign = 'left';
          ctx.fillText(dbArr[di].icon, dx2, startY);
          ctx.fillStyle = '#fff';
          ctx.font = `bold 7px sans-serif`;
          ctx.fillText(String(Math.floor(dbArr[di].stacks)), dx2 + iconSize - 2, startY - 1);
        }
      }
    }
    ctx.restore();
  }

  // --- Boss ---
  if (waveState.boss && waveState.bossAlive) {
    const boss = waveState.boss;
    ctx.save();
    ctx.translate(boss.x, boss.y);

    if (boss.shadowBarrierTimer > 0) {
      ctx.globalAlpha = 0.2 + Math.sin(gameTime * 4) * 0.1;
      ctx.fillStyle = '#8e44ad';
      ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, boss.radius + 120), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    let bColor = boss.color;
    if (boss.hitFlash > 0) bColor = '#fff';
    if (boss.frenzyActive) bColor = '#ff0000';
    if (boss.isInvulnerable) bColor = '#888';
    if (boss.chillFrozenTimer > 0) bColor = '#aaddff';

    ctx.shadowColor = boss.eyeColor;
    ctx.shadowBlur = 20 + Math.sin(boss.animTimer * 3) * 5;
    ctx.fillStyle = bColor;
    ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, boss.radius), 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = boss.eyeColor;
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.5 + Math.sin(boss.animTimer * 2) * 0.3;
    ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, boss.radius * 0.7), 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;

    if (boss.phase === 2) {
      ctx.strokeStyle = '#ff0040';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.4 + Math.sin(boss.animTimer * 5) * 0.3;
      ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, boss.radius + 15), 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    const eOff = boss.radius * 0.3;
    const eR = Math.max(0.1, boss.radius * 0.18);
    ctx.fillStyle = boss.eyeColor;
    ctx.shadowColor = boss.eyeColor;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(-eOff, -eOff * 0.3, eR, 0, Math.PI * 2);
    ctx.arc(eOff, -eOff * 0.3, eR, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText(boss.bossName, 0, -boss.radius - 18);

    const bBarW = boss.radius * 2.5;
    const bBarH = 6;
    const bBarY = -boss.radius - 12;
    ctx.fillStyle = '#333';
    ctx.fillRect(-bBarW / 2, bBarY, bBarW, bBarH);
    ctx.fillStyle = boss.phase === 2 ? '#ff0040' : boss.eyeColor;
    ctx.fillRect(-bBarW / 2, bBarY, bBarW * Math.max(0, boss.hp / boss.maxHp), bBarH);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(-bBarW / 2, bBarY, bBarW, bBarH);

    const ba = angle(boss, player);
    ctx.strokeStyle = bColor;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(ba + 0.7) * boss.radius, Math.sin(ba + 0.7) * boss.radius);
    ctx.lineTo(Math.cos(ba + 0.3) * (boss.radius + 20), Math.sin(ba + 0.3) * (boss.radius + 20));
    ctx.moveTo(Math.cos(ba - 0.7) * boss.radius, Math.sin(ba - 0.7) * boss.radius);
    ctx.lineTo(Math.cos(ba - 0.3) * (boss.radius + 20), Math.sin(ba - 0.3) * (boss.radius + 20));
    ctx.stroke();

    ctx.restore();
  }

  // --- Lightnings ---
  for (const l of lightnings) {
    if (l.isExplosion) {
      ctx.globalAlpha = l.life / 0.3;
      ctx.strokeStyle = l.color || '#ff6600';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(l.x1, l.y1, Math.max(0.1, l.radius * (1 - l.life / 0.3)), 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (l.isSlash) {
      ctx.globalAlpha = l.life / 0.3;
      ctx.strokeStyle = '#e74c3c';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(l.x1, l.y1);
      ctx.lineTo(l.x2, l.y2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (l.isLaser) {
      ctx.globalAlpha = l.life / 0.15;
      ctx.strokeStyle = l.color || '#ff4444';
      ctx.lineWidth = 3;
      ctx.shadowColor = l.color || '#ff4444';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(l.x1, l.y1);
      ctx.lineTo(l.x2, l.y2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = l.life / 0.2;
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      const ddx = l.x2 - l.x1;
      const ddy = l.y2 - l.y1;
      ctx.moveTo(l.x1, l.y1);
      for (let s = 1; s < 5; s++) {
        const t = s / 5;
        ctx.lineTo(l.x1 + ddx * t + rand(-15, 15), l.y1 + ddy * t + rand(-15, 15));
      }
      ctx.lineTo(l.x2, l.y2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // --- Player ---
  ctx.save();
  ctx.translate(player.x, player.y);
  if (player.invTimer > 0 && Math.floor(player.invTimer * 20) % 2 === 0) ctx.globalAlpha = 0.4;
  ctx.shadowColor = player.mpColor || COLORS.player;
  ctx.shadowBlur = 15;

  let faceDir = aimDir; // 默认使用瞄准方向
  if (autoAim) {
    // 自动瞄准时，朝最近的敌人方向
    const nearest = findNearestZombie(player.x, player.y, 500, 1);
    if (nearest) faceDir = angle(player, nearest);
  }
  if (aimJoystick.active && (aimJoystick.inputX !== 0 || aimJoystick.inputY !== 0)) {
    faceDir = Math.atan2(aimJoystick.inputY, aimJoystick.inputX);
  }
  if (joystick.active && (joystick.inputX !== 0 || joystick.inputY !== 0)) {
    faceDir = Math.atan2(joystick.inputY, joystick.inputX);
  }

  const pe = player.radius * 0.3;

  // Class-specific appearance
  if (player.classId === 'scientist') {
    // White body
    ctx.fillStyle = player.damageFlash > 0 ? '#ff6666' : '#eee';
    ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, player.radius), 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, player.radius), 0, Math.PI * 2); ctx.stroke();
    // Glasses
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(Math.cos(faceDir) * pe - 5, Math.sin(faceDir) * pe - 3, 4, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(Math.cos(faceDir) * pe + 5, Math.sin(faceDir) * pe - 3, 4, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(Math.cos(faceDir) * pe - 1, Math.sin(faceDir) * pe - 3); ctx.lineTo(Math.cos(faceDir) * pe + 1, Math.sin(faceDir) * pe - 3); ctx.stroke();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(Math.cos(faceDir) * pe - 5, Math.sin(faceDir) * pe - 3, 1.5, 0, Math.PI * 2);
    ctx.arc(Math.cos(faceDir) * pe + 5, Math.sin(faceDir) * pe - 3, 1.5, 0, Math.PI * 2);
    ctx.fill();
  } else if (player.classId === 'gunner') {
    // Blue body (default color)
    ctx.fillStyle = player.damageFlash > 0 ? '#ff6666' : (player.mpColor || COLORS.player);
    ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, player.radius), 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = COLORS.playerOutline; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, player.radius), 0, Math.PI * 2); ctx.stroke();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(Math.cos(faceDir) * pe - 4, Math.sin(faceDir) * pe - 3, 4, 0, Math.PI * 2);
    ctx.arc(Math.cos(faceDir) * pe + 4, Math.sin(faceDir) * pe - 3, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(Math.cos(faceDir) * pe - 4 + Math.cos(faceDir) * 1.5, Math.sin(faceDir) * pe - 3 + Math.sin(faceDir) * 1.5, 2, 0, Math.PI * 2);
    ctx.arc(Math.cos(faceDir) * pe + 4 + Math.cos(faceDir) * 1.5, Math.sin(faceDir) * pe - 3 + Math.sin(faceDir) * 1.5, 2, 0, Math.PI * 2);
    ctx.fill();
    // Gun in right hand
    ctx.save();
    ctx.translate(0, 0);
    ctx.rotate(faceDir);
    ctx.fillStyle = '#888';
    ctx.fillRect(player.radius * 0.6, -3, player.radius * 1.2, 6);
    ctx.fillStyle = '#555';
    ctx.fillRect(player.radius * 0.6 + player.radius * 1.1, -4, 6, 8);
    ctx.restore();
  } else if (player.classId === 'mechanist') {
    // Dark body
    ctx.fillStyle = player.damageFlash > 0 ? '#ff6666' : '#333';
    ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, player.radius), 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // Armor hexagon outline
    ctx.strokeStyle = '#ffaa00'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let hi = 0; hi < 6; hi++) {
      const ha = (Math.PI * 2 / 6) * hi - Math.PI / 6;
      const hx = Math.cos(ha) * (player.radius + 5);
      const hy = Math.sin(ha) * (player.radius + 5);
      if (hi === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
    }
    ctx.closePath(); ctx.stroke();
    // Eyes
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.arc(Math.cos(faceDir) * pe - 4, Math.sin(faceDir) * pe - 3, 3, 0, Math.PI * 2);
    ctx.arc(Math.cos(faceDir) * pe + 4, Math.sin(faceDir) * pe - 3, 3, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Default (fallback)
    ctx.fillStyle = player.damageFlash > 0 ? '#ff6666' : (player.mpColor || COLORS.player);
    ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, player.radius), 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = COLORS.playerOutline; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, player.radius), 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(Math.cos(faceDir) * pe - 4, Math.sin(faceDir) * pe - 3, 4, 0, Math.PI * 2);
    ctx.arc(Math.cos(faceDir) * pe + 4, Math.sin(faceDir) * pe - 3, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(Math.cos(faceDir) * pe - 4 + Math.cos(faceDir) * 1.5, Math.sin(faceDir) * pe - 3 + Math.sin(faceDir) * 1.5, 2, 0, Math.PI * 2);
    ctx.arc(Math.cos(faceDir) * pe + 4 + Math.cos(faceDir) * 1.5, Math.sin(faceDir) * pe - 3 + Math.sin(faceDir) * 1.5, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // --- Other Players (Multiplayer) ---
  renderOtherPlayers();

  // 渲染其他玩家（基于服务器插值数据）
    for (const pid in mpLerpPlayers) {
      const p = mpLerpPlayers[pid];
      if (!p.alive) continue;
      const sx = p.x - camera.x + canvas.width / 2;
      const sy = p.y - camera.y + canvas.height / 2;
      if (sx < -50 || sx > canvas.width + 50 || sy < -50 || sy > canvas.height + 50) continue;
      
      ctx.save();
      ctx.translate(sx, sy);
      
      // 简单的玩家渲染
      ctx.fillStyle = '#4488ff';
      ctx.beginPath();
      ctx.arc(0, 0, 15, 0, Math.PI * 2);
      ctx.fill();
      
      // 名字
      ctx.fillStyle = '#fff';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(p.name || pid, 0, -20);
      
      // HP bar
      ctx.fillStyle = '#333'; ctx.fillRect(-15, -22, 30, 3);
      ctx.fillStyle = '#2ecc71'; ctx.fillRect(-15, -22, 30 * (p.hp / 100), 3);
      
      ctx.restore();
    }

  // --- Particles ---
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.1, p.radius * (p.life / p.maxLife)), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // --- Damage Numbers ---
  ctx.font = 'bold 16px Microsoft YaHei';
  ctx.textAlign = 'center';
  for (const d of damageNumbers) {
    ctx.globalAlpha = d.life / 0.8;
    ctx.fillStyle = d.color;
    ctx.fillText(d.value, d.x, d.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore(); // camera

  // --- Virtual Joystick ---
  if (joystick.visible) {
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(joystick.baseX, joystick.baseY, Math.max(0.1, joystick.baseRadius), 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(joystick.thumbX, joystick.thumbY, Math.max(0.1, joystick.thumbRadius), 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
  }
  // Aim joystick visualization
  if (aimJoystick.active) {
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(aimJoystick.startX, aimJoystick.startY, aimJoystick.baseRadius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(231,76,60,0.2)';
    ctx.beginPath();
    ctx.arc(aimJoystick.startX, aimJoystick.startY, aimJoystick.baseRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,100,100,0.6)';
    ctx.beginPath();
    ctx.arc(aimJoystick.currentX, aimJoystick.currentY, aimJoystick.thumbRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // --- HUD ---
  renderHUD();

  // --- Big Announcements ---
  for (const ann of bigAnnouncements) {
    const alpha = Math.min(1, ann.life);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = ann.color;
    ctx.font = `bold ${Math.max(20, 40 * uiScale)}px Microsoft YaHei`;
    ctx.textAlign = 'center';
    ctx.shadowColor = ann.color;
    ctx.shadowBlur = 20;
    const yOff = (1 - alpha) * 20;
    ctx.fillText(ann.text, canvas.width / 2, canvas.height / 2 - 50 - yOff);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

function renderHUD() {
  const s = uiScale;
  const pad = Math.max(8, 20 * s);

  // HP Bar
  const hpBarW = Math.max(100, 250 * s);
  const hpBarH = Math.max(12, 20 * s);
  ctx.fillStyle = COLORS.hpBg;
  ctx.fillRect(pad, pad, hpBarW, hpBarH);
  ctx.fillStyle = COLORS.hp;
  ctx.fillRect(pad, pad, hpBarW * (player.hp / player.maxHp), hpBarH);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.strokeRect(pad, pad, hpBarW, hpBarH);
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.max(9, 13 * s)}px Microsoft YaHei`;
  ctx.textAlign = 'center';
  ctx.fillText(`HP: ${Math.ceil(player.hp)} / ${player.maxHp}`, pad + hpBarW / 2, pad + hpBarH * 0.75);

  // XP Bar
  const xpBarW = hpBarW;
  const xpBarH = Math.max(8, 12 * s);
  ctx.fillStyle = COLORS.xpBg;
  ctx.fillRect(pad, pad + hpBarH + 4 * s, xpBarW, xpBarH);
  ctx.fillStyle = COLORS.xp;
  ctx.fillRect(pad, pad + hpBarH + 4 * s, xpBarW * (player.xp / player.xpToNext), xpBarH);
  ctx.strokeStyle = '#333';
  ctx.strokeRect(pad, pad + hpBarH + 4 * s, xpBarW, xpBarH);
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.max(7, 10 * s)}px Microsoft YaHei`;
  ctx.fillText(`Lv.${player.level}  XP: ${player.xp}/${player.xpToNext}`, pad + xpBarW / 2, pad + hpBarH + 4 * s + xpBarH * 0.8);

  // Class display
  const classDef = CLASS_DEFS[player.classId];
  if (classDef) {
    ctx.font = `${Math.max(10, 14 * s)}px Microsoft YaHei`;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#e74c3c';
    ctx.fillText(`${classDef.icon} ${classDef.name}`, pad, pad + hpBarH + xpBarH + 20 * s);
  }

  // Timer
  const minutes = Math.floor(gameTime / 60);
  const seconds = Math.floor(gameTime % 60);
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.max(14, 24 * s)}px Microsoft YaHei`;
  ctx.textAlign = 'center';
  ctx.fillText(`${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`, canvas.width / 2, pad + 20 * s);

  // Wave indicator
  ctx.font = `${Math.max(9, 14 * s)}px Microsoft YaHei`;
  ctx.textAlign = 'center';
  ctx.fillStyle = waveState.bossAlive ? '#e74c3c' : '#888';
  const waveText = waveState.bossAlive && waveState.boss
    ? `${waveState.boss.bossTitle}: ${waveState.boss.bossName}`
    : waveState.currentWave < 0
      ? `下一波: ${formatTime(WAVE_INTERVAL - gameTime)}`
      : `下一波: ${formatTime((waveState.currentWave + 2) * WAVE_INTERVAL - gameTime)}`;
  ctx.fillText(waveText, canvas.width / 2, pad + 40 * s);

  // Boss HP bar
  if (waveState.bossAlive && waveState.boss) {
    const boss = waveState.boss;
    const bossBarW = Math.max(150, Math.min(400 * s, canvas.width - pad * 2));
    const bossBarH = Math.max(10, 16 * s);
    const bossBarX = (canvas.width - bossBarW) / 2;
    const bossBarY = pad + 50 * s;

    ctx.fillStyle = '#333';
    ctx.fillRect(bossBarX, bossBarY, bossBarW, bossBarH);
    ctx.fillStyle = boss.phase === 2 ? '#ff0040' : boss.eyeColor;
    ctx.fillRect(bossBarX, bossBarY, bossBarW * Math.max(0, boss.hp / boss.maxHp), bossBarH);
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1;
    ctx.strokeRect(bossBarX, bossBarY, bossBarW, bossBarH);

    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(8, 12 * s)}px Microsoft YaHei`;
    ctx.fillText(`${boss.bossName} - ${Math.ceil(boss.hp)} / ${boss.maxHp}${boss.phase === 2 ? ' [狂暴]' : ''}`, canvas.width / 2, bossBarY + bossBarH * 0.75);
  }

  // Kill count
  ctx.font = `${Math.max(10, 14 * s)}px Microsoft YaHei`;
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ccc';
  ctx.fillText(`击杀: ${killCount}`, canvas.width - pad, pad + 15 * s);

  // Round display (if multi-round)
  if (waveState.currentWave >= 0) {
    const roundNum = Math.floor(waveState.currentWave / BOSS_DEFS.length) + 1;
    if (roundNum > 1) {
      ctx.fillStyle = '#ffcc00';
      ctx.font = `bold ${Math.max(10, 14 * s)}px Microsoft YaHei`;
      ctx.fillText(`第${roundNum}轮`, canvas.width - pad, pad + 35 * s);
    }
  }

  // Weapon icons
  ctx.textAlign = 'left';
  const weaponFontSize = Math.max(9, 14 * s);
  ctx.font = `${weaponFontSize}px Microsoft YaHei`;
  const weaponLineH = Math.max(14, 22 * s);
  player.weapons.forEach((w, idx) => {
    const def = WEAPON_DEFS[w.defId];
    if (!def) return;
    const isEpic = w.level >= MAX_WEAPON_LEVEL;
    ctx.fillStyle = isEpic ? '#9b59b6' : '#ddd';
    const epicTag = isEpic ? ' ★' : '';
    ctx.fillText(`${def.icon} ${def.name} Lv.${w.level}${epicTag}`, pad, canvas.height - pad - (player.weapons.length - 1 - idx) * weaponLineH);
  });

  // Minimap
  const mmSize = Math.max(60, 120 * s);
  const mmX = canvas.width - pad - mmSize;
  const mmY = canvas.height - pad - mmSize;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(mmX, mmY, mmSize, mmSize);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.strokeRect(mmX, mmY, mmSize, mmSize);

  const mmPx = mmX + (player.x / WORLD_W) * mmSize;
  const mmPy = mmY + (player.y / WORLD_H) * mmSize;
  ctx.fillStyle = player.mpColor || COLORS.player;
  ctx.beginPath(); ctx.arc(mmPx, mmPy, Math.max(1, 3 * s), 0, Math.PI * 2); ctx.fill();

  if (gameMode === 'multi') {
    for (const id in mpPlayers) {
      const p = mpPlayers[id];
      if (Date.now() - p.lastUpdate > 5000 || !p.alive) continue;
      ctx.fillStyle = p.color;
      const opx = mmX + (p.x / WORLD_W) * mmSize;
      const opy = mmY + (p.y / WORLD_H) * mmSize;
      ctx.beginPath(); ctx.arc(opx, opy, Math.max(1, 2 * s), 0, Math.PI * 2); ctx.fill();
    }
  }

  if (waveState.bossAlive && waveState.boss) {
    ctx.fillStyle = '#e74c3c';
    const bmx = mmX + (waveState.boss.x / WORLD_W) * mmSize;
    const bmy = mmY + (waveState.boss.y / WORLD_H) * mmSize;
    ctx.beginPath(); ctx.arc(bmx, bmy, Math.max(1, 4 * s), 0, Math.PI * 2); ctx.fill();
  }

  ctx.fillStyle = 'rgba(46, 204, 113, 0.6)';
  const mmScale = mmSize / WORLD_W;
  for (let i = 0; i < zombies.length; i += 3) {
    const z = zombies[i];
    ctx.fillRect(mmX + z.x * mmScale, mmY + z.y * mmScale, 1, 1);
  }

  // Wave Announcement
  if (waveState.waveAnnounceTimer > 0) {
    const alpha = Math.min(1, waveState.waveAnnounceTimer);
    const isWarning = waveState.waveAnnounceText.includes('击败');
    ctx.globalAlpha = alpha;
    ctx.fillStyle = isWarning ? '#2ecc71' : '#e74c3c';
    ctx.font = `bold ${Math.max(20, 36 * s)}px Microsoft YaHei`;
    ctx.textAlign = 'center';
    ctx.shadowColor = isWarning ? '#2ecc71' : '#e74c3c';
    ctx.shadowBlur = 20;
    ctx.fillText(waveState.waveAnnounceText, canvas.width / 2, canvas.height / 2 - 100 * s);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  updateMultiplayerScoreboard();
}

function formatTime(seconds) {
  if (seconds < 0) seconds = 0;
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

// ============================================================
// LEVEL UP SCREEN
// ============================================================
function showLevelUpScreen() {
  AudioSys.levelup();
  gamePaused = true;
  const screen = document.getElementById('level-up-screen');
  const optionsDiv = document.getElementById('level-up-options');
  screen.style.display = 'block';
  optionsDiv.innerHTML = '';

  const options = generateLevelUpOptions();
  for (const opt of options) {
    const btn = document.createElement('button');
    const isEpic = opt.currentLevel >= MAX_WEAPON_LEVEL - 1;
    btn.className = 'level-up-btn' + (isEpic ? ' epic-btn' : '');
    btn.innerHTML = `<div class="skill-name">${opt.icon} ${opt.name} ${opt.currentLevel > 0 ? `Lv.${opt.currentLevel} -> Lv.${opt.currentLevel + 1}` : '新!'}</div><div class="skill-desc">${opt.desc}</div>`;
    btn.onclick = () => {
      opt.apply();
      screen.style.display = 'none';
      gamePaused = false;
    };
    optionsDiv.appendChild(btn);
  }
}

function generateLevelUpOptions() {
  const options = [];
  const classDef = CLASS_DEFS[player.classId];
  const availablePool = classDef ? classDef.availableWeapons : [];
  const ownedWeaponIds = player.weapons.map(w => w.defId);
  const unownedWeapons = availablePool.filter(id => !ownedWeaponIds.includes(id));

  // Check for ultimate weapon unlock
  const maxedWeapons = player.weapons.filter(w => w.level >= MAX_WEAPON_LEVEL);
  if (classDef && classDef.ultimateWeapon && maxedWeapons.length >= 5 && !ownedWeaponIds.includes(classDef.ultimateWeapon.defId)) {
    const uw = classDef.ultimateWeapon;
    const uwDef = WEAPON_DEFS[uw.defId];
    if (uwDef) {
      options.push({
        name: uw.name, icon: uwDef.icon || '⭐', desc: uw.desc,
        currentLevel: 0,
        apply: () => {
          player.weapons.push({ defId: uw.defId, cooldownTimer: 0, level: MAX_WEAPON_LEVEL, turretPlaceTimer: undefined });
          bigAnnouncements.push({ text: `超武解锁: ${uw.name}!`, color: '#ff00ff', life: 3 });
          spawnParticles(player.x, player.y, '#ff00ff', 30, 150, 1);
        },
      });
    }
  }

  if (unownedWeapons.length > 0 && player.weapons.length < 6) {
    const shuffled = unownedWeapons.sort(() => Math.random() - 0.5);
    const newWepId = shuffled[0];
    const def = WEAPON_DEFS[newWepId];
    if (def) {
      options.push({
        name: def.name, icon: def.icon, desc: def.desc,
        currentLevel: 0,
        apply: () => player.weapons.push(createWeaponInstance(newWepId)),
      });
    }
  }

  const upgradeableWeapons = player.weapons.filter(w => w.level < MAX_WEAPON_LEVEL);
  if (upgradeableWeapons.length > 0) {
    const w = upgradeableWeapons[randInt(0, upgradeableWeapons.length - 1)];
    const def = WEAPON_DEFS[w.defId];
    if (def) {
      const nextLevel = w.level + 1;
      const isEpicUpgrade = nextLevel >= MAX_WEAPON_LEVEL;
      options.push({
        name: def.name, icon: def.icon,
        desc: `强化至 Lv.${nextLevel}${isEpicUpgrade ? ' (史诗!)' : ''}: ${getWeaponUpgradeDesc(w.defId, nextLevel)}`,
        currentLevel: w.level,
        apply: () => w.level++,
      });
    }
  }

  const passives = Object.keys(PASSIVE_DEFS).filter(id => (player.passives[id] || 0) < PASSIVE_DEFS[id].maxLevel);
  const shuffledPassives = passives.sort(() => Math.random() - 0.5);
  for (let i = 0; i < Math.min(3, shuffledPassives.length); i++) {
    const id = shuffledPassives[i];
    const p = PASSIVE_DEFS[id];
    options.push({
      name: p.name, icon: p.icon,
      desc: `${p.desc} (当前: ${player.passives[id] || 0}/${p.maxLevel})`,
      currentLevel: player.passives[id] || 0,
      apply: () => { player.passives[id] = (player.passives[id] || 0) + 1; },
    });
  }

  return options.sort(() => Math.random() - 0.5).slice(0, 4);
}

function getWeaponUpgradeDesc(defId, level) {
  const isEpic = level >= MAX_WEAPON_LEVEL;
  switch (defId) {
    case 'pistol': return isEpic ? '史诗: 子弹爆炸(AoE 60px), +150%伤害, 5穿透, 大发光弹' : `伤害 +15%, 穿透 +${level >= 3 ? 1 : 0}`;
    case 'smg': return isEpic ? '史诗: 链式闪电3目标, +150%伤害, 三倍射速' : `伤害 +15%, 射速微增`;
    case 'shotgun': return isEpic ? '史诗: 18弹丸, 360度散射, +150%伤害, 穿透1' : `弹丸数 +1, 伤害 +15%`;
    case 'split_gun': return isEpic ? '史诗: 分裂5枚, 子弹可再分裂, +150%伤害' : `分裂 +1, 伤害 +15%`;
    case 'shock_gun': return isEpic ? '史诗: 10目标链式, 眩晕1秒, +150%伤害' : `链数 +1, 伤害 +20%`;
    case 'flamethrower': return isEpic ? '史诗: 火焰龙卷风+永久灼烧地面, +150%伤害' : `范围 +20, 伤害 +20%`;
    case 'drone': return isEpic ? '史诗: 5无人机, 穿透激光, 护盾, 快速射击' : `无人机 +1, 属性提升`;
    case 'disc_blade': return isEpic ? '史诗: 4飞刃, 更大更快, 出血DoT' : `飞刃 +1, 属性提升`;
    case 'auto_turret': return isEpic ? '史诗: 3炮台, 穿透激光, 护盾光环, 缓慢跟随' : `炮台 +1, 属性提升`;
    case 'mech_beast': return isEpic ? '史诗: 4野兽, 吸血2HP/击杀, 更快更大' : `野兽 +1, 属性提升`;
    case 'mech_warrior': return isEpic ? '史诗: 4战士, 穿透射击, 快速射击' : `战士 +1, 属性提升`;

// ============================================================
// MULTIPLAYER SYSTEM (WebSocket based)
// ============================================================
let mpIsHost = false;
let mpRoomData = null;
let mpPlayerName = '玩家1';
let mpScanTimer = 0;
let mpHeartbeatTimer = 0;
let mpPlayerColorIndex = 0;
let wsReconnectTimer = null;
let wsReconnectDelay = 1000;
let mpRooms = {};

function connectWebSocket() {
  if (mpChannel && mpChannel.readyState === WebSocket.OPEN) return;
  try {
    mpChannel = new WebSocket(WS_URL);
    mpChannel.onopen = () => {
      console.log('WebSocket connected');
      wsReconnectDelay = 1000;
      // If we have a room, re-register
      if (mpIsHost && mpRoomData) {
        mpChannel.send(JSON.stringify({type: 'register_room', room_id: mpRoomData.id, room: mpRoomData}));
      } else if (mpRoomId && !mpIsHost) {
        // Re-join room
        const playerInfo = {id: mpMyId, name: mpPlayerName, color: MP_PLAYER_COLORS[mpPlayerColorIndex]};
        mpChannel.send(JSON.stringify({type: 'join_room', room_id: mpRoomId, player: playerInfo}));
      }
      scanRooms();
    };
    mpChannel.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        onWsMessage(msg);
      } catch(err) {}
    };
    mpChannel.onclose = () => {
      console.log('WebSocket closed, reconnecting...');
      scheduleReconnect();
    };
    mpChannel.onerror = (err) => {
      console.log('WebSocket error:', err);
    };
  } catch(e) {
    console.log('WebSocket connection failed');
    scheduleReconnect();
  }
}

function scheduleReconnect() {
  if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
  wsReconnectTimer = setTimeout(() => {
    wsReconnectDelay = Math.min(5000, wsReconnectDelay * 1.5);
    connectWebSocket();
  }, wsReconnectDelay);
}

function sendWs(msg) {
  if (mpChannel && mpChannel.readyState === WebSocket.OPEN) {
    mpChannel.send(JSON.stringify(msg));
  }
}

function onWsMessage(msg) {
  switch (msg.type) {
    case 'room_list':
      if (!mpIsHost && !mpRoomId) {
        mpRooms = {};
        for (const r of msg.rooms) mpRooms[r.id] = r;
        renderRoomList();
      }
      break;
    case 'room_update':
      if (mpRoomId === msg.room.id) {
        mpRoomData = msg.room;
        updateLobbyPlayers();
      }
      if (!mpIsHost && !mpRoomId) {
        mpRooms[msg.room.id] = msg.room;
        renderRoomList();
      }
      break;
    case 'joined':
      mpRoomData = msg.room;
      updateLobbyPlayers();
      break;
    case 'game_start':
      if (mpRoomId === msg.room_id) {
        startMultiplayerGame(msg.start_time || Date.now());
      }
      break;
    case 'player_state':
      if (msg.player_id !== mpMyId) {
        // 更新mpPlayers（用于记分板等）
        mpPlayers[msg.player_id] = {
          x: msg.x, y: msg.y, hp: msg.hp, maxHp: msg.maxHp,
          level: msg.level, kills: msg.killCount, name: msg.name,
          color: msg.color || '#4488ff', alive: msg.alive, lastUpdate: Date.now(),
        };
        // 更新mpLerpPlayers（用于渲染插值）
        if (!mpLerpPlayers[msg.player_id]) mpLerpPlayers[msg.player_id] = {};
        const lp = mpLerpPlayers[msg.player_id];
        lp.tx = msg.x;
        lp.ty = msg.y;
        lp.hp = msg.hp;
        lp.maxHp = msg.maxHp;
        lp.alive = msg.alive;
        lp.classId = msg.classId;
        lp.aimDir = msg.aimDir;
        lp.name = msg.name;
        if (lp.x === undefined) {
          lp.x = msg.x;
          lp.y = msg.y;
        }
      }
      break;
    case 'player_died':
      if (mpPlayers[msg.player_id]) mpPlayers[msg.player_id].alive = false;
      break;
  }
}

}

function renderRoomList() {
  const list = document.getElementById('room-list');
  const rooms = Object.values(mpRooms);
  if (rooms.length === 0) {
    list.innerHTML = '<div style="color:#666; text-align:center; padding:15px;">未发现可用房间</div>';
    return;
  }
  list.innerHTML = rooms.map(room => {
    const isFull = room.players.length >= room.maxPlayers;
    return `
    <div class="room-item">
      <div class="room-info">
        <div class="room-name">🏠 ${room.name}</div>
        <div class="room-detail">${room.players.length}/${room.maxPlayers}人 | 房主: ${room.players[0]?.name || '未知'}</div>

      </button>
    </div>
  `;
  }).join('');
}

function createRoom() {
  const roomName = document.getElementById('create-room-name').value || '未命名房间';
  mpPlayerName = document.getElementById('create-player-name').value || '玩家1';
  mpMyId = 'p_' + Math.random().toString(36).substr(2, 8);
  mpIsHost = true;
  mpPlayerColorIndex = 0;

  mpRoomData = {
    id: 'room_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
    name: roomName,
    host: mpMyId,
    players: [{id: mpMyId, name: mpPlayerName, color: MP_PLAYER_COLORS[0]}],
    maxPlayers: 4,
    status: 'waiting',
    createdAt: Date.now(),
  };
  mpRoomId = mpRoomData.id;
  mpRooms = {};

  sendWs({type: 'register_room', room_id: mpRoomData.id, room: mpRoomData});

function joinRoom(roomId) {
  const room = mpRooms[roomId];
  if (!room || room.players.length >= room.maxPlayers) return;
  mpPlayerName = document.getElementById('create-player-name').value || '玩家2';
  mpMyId = 'p_' + Math.random().toString(36).substr(2, 8);
  mpIsHost = false;
  mpRoomId = roomId;
  mpPlayerColorIndex = room.players.length;

  const playerInfo = {id: mpMyId, name: mpPlayerName, color: MP_PLAYER_COLORS[room.players.length]};
  sendWs({type: 'join_room', room_id: roomId, player: playerInfo});

  // Hide create/scan sections, show room detail
  document.getElementById('lobby-create-section').classList.add('lobby-hidden');
  document.getElementById('lobby-scan-section').classList.add('lobby-hidden');
  document.getElementById('room-detail-section').style.display = 'block';
  document.getElementById('lobby-status').textContent = '已加入房间，等待房主开始游戏...';
  updateLobbyPlayers();
}

function leaveRoom() {
  if (mpRoomId) {
    sendWs({type: 'leave_room', room_id: mpRoomId, player_id: mpMyId});
  }
  mpRoomId = null;
  mpRoomData = null;
  mpIsHost = false;
  mpPlayers = {};
  document.getElementById('room-detail-section').style.display = 'none';

  document.getElementById('lobby-create-section').classList.remove('lobby-hidden');

function updateLobbyPlayers() {
  if (!mpRoomData) return;
  const list = document.getElementById('lobby-player-list');
  list.innerHTML = mpRoomData.players.map((p) => `
    <span class="lobby-player-tag" style="background:${p.color}; color:#fff;">

  const startBtn = document.getElementById('btn-start-multi');

    startBtn.textContent = mpRoomData.players.length >= 2 ? '🚀 开始游戏' : '🚀 开始(1人也能玩)';

function renderOtherPlayers() {
  if (gameMode !== 'multi') return;
  const now = Date.now();
  for (const id in mpPlayers) {
    const p = mpPlayers[id];
    if (now - p.lastUpdate > 5000) continue;
    if (!p.alive) continue;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, 0, -24);
    const hpRatio = Math.max(0, p.hp / p.maxHp);
    ctx.fillStyle = '#333';
    ctx.fillRect(-20, -32, 40, 4);
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(-20, -32, 40 * hpRatio, 4);
    ctx.restore();
  }
}

function updateMultiplayerScoreboard() {
  if (gameMode !== 'multi') return;
  const sb = document.getElementById('mp-scoreboard');
  let html = '<h4>🏆 联机排行</h4>';
  const allPlayers = [];
  if (player) {
    allPlayers.push({name: player.mpName || '我', color: player.mpColor || '#3498db', kills: killCount, level: player.level, alive: player.hp > 0, isMe: true});
  }
  for (const id in mpPlayers) {
    const p = mpPlayers[id];
    if (Date.now() - p.lastUpdate > 5000) continue;
    allPlayers.push({name: p.name, color: p.color, kills: p.kills, level: p.level, alive: p.alive, isMe: false});
  }
  allPlayers.sort((a, b) => b.kills - a.kills);
  for (const p of allPlayers) {
    html += `<div class="sb-row${!p.alive ? ' sb-dead' : ''}"><span class="sb-name" style="color:${p.color}">${p.name}${p.isMe ? '(我)' : ''}</span><span>Lv.${p.level} | ${p.kills}杀</span></div>`;
  }
  sb.innerHTML = html;
}

// Button bindings
document.getElementById('btn-create-room').onclick = createRoom;
document.getElementById('btn-scan-rooms').onclick = scanRooms;
document.getElementById('btn-leave-room').onclick = leaveRoom;
document.getElementById('btn-start-multi').onclick = startMultiplayerAsHost;

requestAnimationFrame((ts) => {
  lastTime = ts;
  gameLoop(ts);
});
</script>
